[tool.ruff]
target-version = "py312"
extend-exclude = [
    ".venv",
    ".tmp",
    "docs/_build",
    "docs/_review",
    "reports",
    "site",
]

[tool.ruff.lint]
# F covers F401/F811/F821/F841 etc.; B023 flags closures that capture a loop
# variable; B904 keeps the exception chain when re-raising inside `except`;
# PLW1510 makes every subprocess.run state whether a non-zero exit raises.
# Audited B023 false positives carry an inline `# noqa: B023 -- <reason>`;
# intentional re-exports use the redundant-alias form (`name as name`).
# Plan: code-as-doc/dev/code_quality_iterability_plan.md (CQ-4).
select = ["E722", "F", "B023", "B904", "B905", "PLW1510"]

[tool.ruff.lint.per-file-ignores]
# Test helpers routinely build per-iteration closures that run immediately.
"tests/**" = ["B023"]
# The queue facade hands itself to helper modules via _service_module(), which
# read its re-exported names dynamically; static unused-import analysis cannot
# see those uses. Removing the forwarders is tracked as plan item CQ-2.4.
"tools/process_build_queue.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
# Default permissive across the codebase. Narrow strict scope below as
# modules become ready.

[[tool.mypy.overrides]]
module = "tools.utils.*"
disallow_untyped_defs = true
warn_return_any = true

# CQ-4.5: these packages have no untyped defs; tools/check_mypy_ratchet.py keeps it so in CI.
[[tool.mypy.overrides]]
module = ["tools.manual_ir.*", "tools.component_specs.*", "tools.csv_pages.*"]
disallow_untyped_defs = true

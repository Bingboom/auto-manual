name: Sync Hello-Docs Mirror

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sync-hello-docs-main
  cancel-in-progress: true

permissions:
  contents: read

env:
  MIRROR_REPOSITORY: Bingboom/Hello-Docs
  MIRROR_BRANCH: main

jobs:
  sync:
    if: ${{ github.repository == 'Bingboom/auto-manual' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check mirror token
        env:
          HELLO_DOCS_SYNC_TOKEN: ${{ secrets.HELLO_DOCS_SYNC_TOKEN }}
        run: |
          if [ -z "${HELLO_DOCS_SYNC_TOKEN}" ]; then
            echo "::error::Missing HELLO_DOCS_SYNC_TOKEN. Add a token that can write ${MIRROR_REPOSITORY} contents and workflows."
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          path: source
          fetch-depth: 0

      - name: Checkout mirror
        uses: actions/checkout@v7
        with:
          repository: ${{ env.MIRROR_REPOSITORY }}
          ref: ${{ env.MIRROR_BRANCH }}
          path: mirror
          token: ${{ secrets.HELLO_DOCS_SYNC_TOKEN }}
          fetch-depth: 0

      - name: Commit and push mirror update
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          source_tree="$(git -C source rev-parse HEAD^{tree})"
          mirror_parent="$(git -C mirror rev-parse HEAD)"
          mirror_tree="$(git -C mirror rev-parse HEAD^{tree})"

          # Import the source objects instead of copying a checked-out tree. A
          # checkout followed by `git add` can apply the mirror's attributes
          # (for example, CSV line-ending rules) and produce a different tree.
          source_bundle="$(mktemp)"
          git -C source bundle create "${source_bundle}" HEAD
          git -C mirror fetch --quiet "${source_bundle}" HEAD

          for content_path in docs/publish docs/knowledge; do
            if git -C mirror cat-file -e "${source_tree}:${content_path}" 2>/dev/null; then
              echo "::error::auto-manual must not own ${content_path}; maintain content through a Hello-Docs PR."
              exit 1
            fi
          done

          # Hello-Docs main has two ownership domains: auto-manual owns the
          # mirrored code tree; Hello-Docs owns docs/publish and docs/knowledge.
          # Compose both object trees without checking out or re-adding files.
          mirror_index="$(mktemp)"
          rm -f "${mirror_index}"
          GIT_INDEX_FILE="${mirror_index}" git -C mirror read-tree "${source_tree}"
          for content_path in docs/publish docs/knowledge; do
            content_tree="$(git -C mirror rev-parse --verify "${mirror_parent}:${content_path}" 2>/dev/null || true)"
            if [ -n "${content_tree}" ]; then
              GIT_INDEX_FILE="${mirror_index}" git -C mirror read-tree \
                --prefix="${content_path}/" "${content_tree}"
            fi
          done
          combined_tree="$(GIT_INDEX_FILE="${mirror_index}" git -C mirror write-tree)"

          if [ "${combined_tree}" = "${mirror_tree}" ]; then
            echo "Mirror code already matches ${SOURCE_REPOSITORY}@${SOURCE_SHA}; business content is preserved."
            exit 0
          fi

          git -C mirror config user.name "github-actions[bot]"
          git -C mirror config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mirror_commit="$(git -C mirror commit-tree "${combined_tree}" \
            -p "${mirror_parent}" \
            -m "chore(mirror): sync auto-manual main" \
            -m "Source: ${SOURCE_REPOSITORY}@${SOURCE_SHA}" \
            -m "Run: ${SOURCE_RUN_URL}")"

          git -C mirror update-ref "refs/heads/${MIRROR_BRANCH}" "${mirror_commit}" "${mirror_parent}"

          mirror_tree="$(git -C mirror rev-parse "${mirror_commit}^{tree}")"
          if [ "${combined_tree}" != "${mirror_tree}" ]; then
            echo "::error::Mirror tree ${mirror_tree} does not match composed tree ${combined_tree}."
            exit 1
          fi

          git -C mirror push origin "${mirror_commit}:${MIRROR_BRANCH}"

name: Sync Hello-Docs Mirror

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sync-hello-docs-main
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  issues: write

env:
  MIRROR_REPOSITORY: Bingboom/Hello-Docs
  MIRROR_BRANCH: main

jobs:
  sync:
    if: ${{ github.repository == 'Bingboom/auto-manual' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check mirror token
        env:
          HELLO_DOCS_SYNC_TOKEN: ${{ secrets.HELLO_DOCS_SYNC_TOKEN }}
        run: |
          if [ -z "${HELLO_DOCS_SYNC_TOKEN}" ]; then
            echo "::error::Missing HELLO_DOCS_SYNC_TOKEN. Add a token that can write ${MIRROR_REPOSITORY} contents and workflows."
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 0

      - name: Checkout mirror
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MIRROR_REPOSITORY }}
          ref: ${{ env.MIRROR_BRANCH }}
          path: mirror
          token: ${{ secrets.HELLO_DOCS_SYNC_TOKEN }}
          fetch-depth: 0

      - name: Commit and push mirror update
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MIRROR_KEEP_PATHS: docs/publish docs/knowledge
          SOURCE_FORBIDDEN_PATHS: docs/publish docs/knowledge docs/review-drafts
        run: bash source/scripts/sync_mirror.sh

      - name: Workspace mirror failure notice
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        env:
          SYNC_STATUS: ${{ job.status }}
        with:
          script: |
            const title = 'Workspace data update: mirror';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (process.env.SYNC_STATUS === 'success') {
              if (existing) await github.rest.issues.update({...context.repo, issue_number: existing.number, state: 'closed'});
              return;
            }
            if (existing) return;
            const history = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'sync-hello-docs.yml', status: 'success', per_page: 1,
            });
            const previous = history.data.workflow_runs[0];
            await github.rest.issues.create({...context.repo, title, body: [
              '来源：工程定义与工作台代码。失败阶段：镜像同步。',
              `上次成功：${previous ? previous.updated_at + ' ' + previous.html_url : 'Unavailable'}`,
              `日志：https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '补做：重新运行 Sync Hello-Docs Mirror 的失败任务；无需重新生产说明书。',
              '镜像成功后仍需 Workspace Data Verify 核验线上版本。',
            ].join('\n\n')});

  # Private review-draft mirror (Hello-Docs-Review → private Read the Docs project).
  # It keeps only docs/review-drafts; without its token the job reports a notice and
  # skips, so the Hello-Docs sync above never depends on it.
  sync-review:
    if: ${{ github.repository == 'Bingboom/auto-manual' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      MIRROR_REPOSITORY: Bingboom/Hello-Docs-Review
    steps:
      - name: Check review mirror token
        id: token
        env:
          REVIEW_DOCS_SYNC_TOKEN: ${{ secrets.REVIEW_DOCS_SYNC_TOKEN }}
        run: |
          if [ -z "${REVIEW_DOCS_SYNC_TOKEN}" ]; then
            echo "::notice::REVIEW_DOCS_SYNC_TOKEN is not set; the private review mirror was not synced."
            echo "ready=false" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout source
        if: ${{ steps.token.outputs.ready == 'true' }}
        uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 0

      - name: Checkout review mirror
        if: ${{ steps.token.outputs.ready == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MIRROR_REPOSITORY }}
          ref: ${{ env.MIRROR_BRANCH }}
          path: mirror
          token: ${{ secrets.REVIEW_DOCS_SYNC_TOKEN }}
          fetch-depth: 0

      - name: Commit and push review mirror update
        if: ${{ steps.token.outputs.ready == 'true' }}
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MIRROR_KEEP_PATHS: docs/review-drafts
          SOURCE_FORBIDDEN_PATHS: docs/publish docs/knowledge docs/review-drafts
        run: bash source/scripts/sync_mirror.sh

name: Review Branch Sync Check

on:
  schedule:
    - cron: "0 2 * * *" # daily 02:00 UTC
  workflow_dispatch:

concurrency:
  group: review-branch-sync-check
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  review-sync:
    if: ${{ github.repository == 'Bingboom/auto-manual' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all review branches
        run: git fetch --prune --no-tags origin main '+refs/heads/review/*:refs/remotes/origin/review/*'

      - name: Check review branch sync
        id: sync
        shell: bash
        run: |
          drift=false
          review_refs="$(git for-each-ref --format='%(refname:short)' refs/remotes/origin/review/)"
          : > review_sync_out.txt
          if [ -z "${review_refs}" ]; then
            echo "[review-branch-sync] OK: no review branches found." | tee review_sync_out.txt
          else
            while IFS= read -r review_ref; do
              [ -z "${review_ref}" ] && continue
              echo "=== ${review_ref} ===" | tee -a review_sync_out.txt
              python tools/check_review_branch_sync.py \
                --base "${review_ref}" \
                --remote origin \
                --repo-root . \
                --strict | tee -a review_sync_out.txt
              rc=${PIPESTATUS[0]}
              if [ "${rc}" -ne 0 ]; then
                drift=true
              fi
            done <<< "${review_refs}"
          fi
          echo "drift=${drift}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Review branch sync check"
            echo
            echo '```'
            cat review_sync_out.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Open or update drift issue
        if: ${{ steps.sync.outputs.drift == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '[review-sync-drift] shared source changed while review branches are open';
            const out = fs.readFileSync('review_sync_out.txt', 'utf8');
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'Shared templates or manifests changed while one or more review branches still contain frozen derivatives.',
              'Run sync-review for the affected branch and inspect any placeholder-bearing line before merging the update.',
              '',
              `Run: ${runUrl}`,
              '',
              '```',
              out,
              '```',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === marker && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: marker,
                body,
              });
            }

      - name: Resolve drift issue
        if: ${{ steps.sync.outputs.drift == 'false' }}
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '[review-sync-drift] shared source changed while review branches are open';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === marker && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Resolved — no review branch drift detected. Run: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }

      - name: Fail when drift is detected
        if: ${{ steps.sync.outputs.drift == 'true' }}
        run: echo "::error::review branch sync drift detected — see the [review-sync-drift] issue and run summary." && exit 1

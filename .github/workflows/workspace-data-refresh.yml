name: Workspace Data Refresh
on:
  # 网页说明书进度 has no completion receipt (the 网页文档 table is kept by hand), so it
  # refreshes every day at 07:17 Beijing time; the other sources refresh after their batches.
  # The same schedule runs the product-matrix check as its own job (operator 2026-11-18): it
  # compares the matrix base with the committed snapshot and, when the base has moved on,
  # proposes the re-read snapshot in a content PR that waits for review.
  schedule:
    - cron: '17 23 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Source to recheck after a completed production or asset batch
        type: choice
        options: [deliverables, corpus, web_progress, product_matrix]
        required: true
permissions:
  # actions: write lets a self-merged web_progress PR start Workspace Data Verify, which a merge
  # made with this token would not trigger (operator approved 2026-11-04).
  actions: write
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: workspace-refresh-${{ inputs.source || 'web_progress' }}
  cancel-in-progress: false
jobs:
  refresh:
    if: ${{ github.repository == 'Bingboom/Hello-Docs' && github.ref == 'refs/heads/main' && inputs.source != 'product_matrix' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_PHASE2_IDENTITY: bot
      FEISHU_PHASE2_BASE_TOKEN: ${{ secrets.FEISHU_PHASE2_BASE_TOKEN }}
      FEISHU_PHASE2_DOCUMENT_LINK_TABLE_ID: ${{ secrets.FEISHU_PHASE2_DOCUMENT_LINK_TABLE_ID }}
      FEISHU_PHASE2_MODEL_CAPABILITIES_TABLE_ID: ${{ secrets.FEISHU_PHASE2_MODEL_CAPABILITIES_TABLE_ID }}
      FEISHU_TRANSLATION_MEMORY_BASE_TOKEN: ${{ secrets.FEISHU_TRANSLATION_MEMORY_BASE_TOKEN }}
      FEISHU_PUBLISHED_DOCS_BASE_TOKEN: ${{ secrets.FEISHU_PUBLISHED_DOCS_BASE_TOKEN }}
      FEISHU_PUBLISHED_DOCS_WEB_TABLE_ID: ${{ secrets.FEISHU_PUBLISHED_DOCS_WEB_TABLE_ID }}
      FEISHU_PUBLISHED_DOCS_REVIEW_TABLE_ID: ${{ secrets.FEISHU_PUBLISHED_DOCS_REVIEW_TABLE_ID }}
      FEISHU_PUBLISHED_DOCS_URL: ${{ secrets.FEISHU_PUBLISHED_DOCS_URL }}
      REFRESH_SOURCE: ${{ inputs.source || 'web_progress' }}
    steps:
      # web_progress dates each language version from the publish manifest's history, so it
      # needs every commit; blob:none keeps that clone to commits and trees, fetching blobs on use.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: ${{ (inputs.source || 'web_progress') == 'web_progress' && '0' || '1' }}
          filter: ${{ (inputs.source || 'web_progress') == 'web_progress' && 'blob:none' || '' }}
      - uses: ./.github/actions/feishu-common-setup
      - uses: ./.github/actions/workspace-data-refresh
        with:
          kind: ${{ env.REFRESH_SOURCE }}
      - name: Source failure notice
        if: ${{ !cancelled() }}
        env:
          REFRESH_KIND: ${{ env.REFRESH_SOURCE }}
          JOB_STATUS: ${{ job.status }}
        run: |
          args=()
          if [ "$JOB_STATUS" = failure ]; then args+=(--failed); fi
          python -m tools.workspace_refresh_notice --kind "$REFRESH_KIND" --report .tmp/workspace-refresh/result.json "${args[@]}"
  product-matrix:
    # Its own job, not a workspace-data kind: the snapshot lives in docs/knowledge/product-matrix/,
    # holds project numbers, and its content PR is never merged automatically.
    if: ${{ github.repository == 'Bingboom/Hello-Docs' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.source == 'product_matrix') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_PUBLISHED_DOCS_BASE_TOKEN: ${{ secrets.FEISHU_PUBLISHED_DOCS_BASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ./.github/actions/feishu-common-setup
      # Exit 0 current or refreshed, 1 behind, 2 failed; the output holds times, hashes and counts only.
      - name: Check the product matrix against its base
        id: check
        continue-on-error: true
        run: python -m tools.product_matrix_base check --out docs/knowledge/product-matrix --write --refresh --log .tmp/product-matrix/result.json
      - name: Submit the refreshed snapshot or the sync status for review
        if: ${{ !cancelled() }}
        run: python -m tools.product_matrix_base.publish --report .tmp/product-matrix/result.json
      - name: Preserve check execution evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: product-matrix-check-${{ github.run_attempt }}
          path: .tmp/product-matrix/
          retention-days: 30
      - name: Report a failed or lagging check
        if: ${{ !cancelled() && steps.check.outcome == 'failure' }}
        run: |
          echo '::error::Product matrix check failed or found the snapshot behind its base. The page keeps the last snapshot and warns; see status.json.'
          exit 1
      - name: Source failure notice
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          args=()
          if [ "$JOB_STATUS" = failure ]; then args+=(--failed); fi
          python -m tools.workspace_refresh_notice --kind product_matrix --report .tmp/product-matrix/result.json "${args[@]}"

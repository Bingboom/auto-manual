name: Nightly Render

on:
  schedule:
    - cron: "45 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly-render
  cancel-in-progress: false

jobs:
  changes:
    if: ${{ github.repository == 'Bingboom/auto-manual' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      cache_key: ${{ steps.inputs.outputs.cache_key }}
      cache_hit: ${{ steps.previous.outputs.cache-hit }}
      previous_ok: ${{ steps.inputs.outputs.previous_ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/ci_change_gate.py
      - name: Fingerprint engineering inputs
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_change_gate.py nightly
      - name: Look up a successful render for these inputs this week
        id: previous
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/nightly-success
          key: ${{ steps.inputs.outputs.cache_key }}-${{ runner.os }}-${{ runner.arch }}
          lookup-only: true
      - name: Explain render decision
        env:
          CACHE_HIT: ${{ steps.previous.outputs.cache-hit }}
          EVENT: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
          PREVIOUS_OK: ${{ steps.inputs.outputs.previous_ok }}
        run: |
          if [ "$EVENT" = schedule ] && [ "$CACHE_HIT" = true ] && [ "$PREVIOUS_OK" = true ] && [ "$ATTEMPT" = 1 ]; then
            echo "Unchanged inputs already rendered successfully this UTC week; skipping toolchain installation." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Render required: manual dispatch, changed inputs, weekly revalidation, missing successful cache or previous failure." >> "$GITHUB_STEP_SUMMARY"
          fi

  render-smoke:
    needs: changes
    if: ${{ !cancelled() && github.repository == 'Bingboom/auto-manual' && (github.event_name == 'workflow_dispatch' || github.run_attempt > 1 || needs.changes.result != 'success' || needs.changes.outputs.cache_hit != 'true' || needs.changes.outputs.previous_ok != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache XeLaTeX apt archives
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/texlive-apt-cache
          key: nightly-render-texlive-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/texlive-apt-packages.txt') }}

      - name: Install render toolchain
        shell: bash
        run: |
          PANDOC_VERSION=3.9.0.2
          apt_cache="${RUNNER_TEMP}/texlive-apt-cache"
          mkdir -p "${apt_cache}/partial"
          mapfile -t texlive_packages < <(sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' .github/texlive-apt-packages.txt)
          if [ "${#texlive_packages[@]}" -eq 0 ]; then
            echo "::error::.github/texlive-apt-packages.txt contains no packages"
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y \
            -o Dir::Cache::archives="${apt_cache}" \
            -o APT::Keep-Downloaded-Packages=true \
            curl poppler-utils "${texlive_packages[@]}"
          sudo chown -R "$(id -u):$(id -g)" "${apt_cache}"
          curl -sSfL \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb" \
            -o "${RUNNER_TEMP}/pandoc.deb"
          sudo dpkg -i "${RUNNER_TEMP}/pandoc.deb"
          xelatex --version | head -n 1
          pandoc --version | head -n 1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Run config doctors and production IDML pilot
        run: |
          python -m tools.nightly_render \
            --configs-dir configs \
            --data-root tests/fixtures/phase2 \
            --report "${RUNNER_TEMP}/nightly-render.json" \
            --pilot-config configs/config.us-en.yaml \
            --pilot-model JE-1000F \
            --pilot-region US \
            --pilot-lang en

      - name: Publish nightly summary
        if: always()
        shell: bash
        run: |
          report="${RUNNER_TEMP}/nightly-render.json"
          if [ ! -f "${report}" ]; then
            echo "Nightly render stopped before its report was written." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - "${report}" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          counts = payload["doctor"]["counts"]
          pilot = payload["pilot"]
          print("### Nightly render")
          print(f"- Config doctors: {counts['PASS']} passed, {counts['FAIL']} failed")
          print(f"- Production IDML pilot: {pilot['status']}")
          print(f"- Pilot detail: {pilot['reason']}")
          artifact = pilot.get("artifact")
          if artifact:
              print(f"- Artifact: `{artifact['path']}`")
              print(f"- SHA-256: `{artifact['sha256']}`")
          PY

      # A failed/cancelled render never writes a success marker. No restore-key
      # prefix: only an exact input fingerprint can suppress the next schedule.
      - name: Record successful render
        if: ${{ success() && needs.changes.outputs.cache_key != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/nightly-success"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/nightly-success/commit"
      - name: Save successful render marker
        if: ${{ success() && needs.changes.outputs.cache_key != '' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/nightly-success
          key: ${{ needs.changes.outputs.cache_key }}-${{ runner.os }}-${{ runner.arch }}

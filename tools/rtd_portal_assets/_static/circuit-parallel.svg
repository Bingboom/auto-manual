<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-label="典型 AC 插座并联电路"><style>text{font-family:system-ui,sans-serif;font-size:18px;fill:#26313b}.wire{fill:none;stroke:#394b5a;stroke-width:2.5}.ctrl{fill:none;stroke:#cf590c;stroke-width:2;stroke-dasharray:6 5}.part{fill:#fff;stroke:#394b5a;stroke-width:2}.note{font-size:15px;fill:#626d77}.node{fill:#394b5a}</style><text x="25" y="32" class="">典型插座并联：共享电源，两条供电导线连接每个负载</text><text x="25" y="105" class="">AC L</text><text x="25" y="300" class="">AC N</text><path class="wire" d="M90 90 H140 M200 90 H890 M90 290 H890"/><rect class="part" x="140" y="80" width="60" height="20"/><text x="145" y="65" class="">F / 保护</text><path class="wire" d="M350 90 V155 M350 230 V290"/><rect class="part" x="334" y="155" width="32" height="75"/><circle class="node" cx="350" cy="90" r="4"/><circle class="node" cx="350" cy="290" r="4"/><text x="310" y="135" class="">插座 1</text><text x="378" y="200" class="">负载</text><path class="wire" d="M570 90 V155 M570 230 V290"/><rect class="part" x="554" y="155" width="32" height="75"/><circle class="node" cx="570" cy="90" r="4"/><circle class="node" cx="570" cy="290" r="4"/><text x="530" y="135" class="">插座 2</text><text x="598" y="200" class="">负载</text><path class="wire" d="M790 90 V155 M790 230 V290"/><rect class="part" x="774" y="155" width="32" height="75"/><circle class="node" cx="790" cy="90" r="4"/><circle class="node" cx="790" cy="290" r="4"/><text x="750" y="135" class="">插座 3</text><text x="818" y="200" class="">负载</text><text x="130" y="355" class="">各支路承受相同电压；总电流 I = I₁ + I₂ + I₃。</text><text x="130" y="390" class="">每个插座限制、各相限制和 AC 总功率限制都要同时满足。</text><text x="25" y="440" class="note">图中 F 仅代表共用保护环节；实际分路保护与接地结构由产品设计决定。</text></svg>
"560" width="230" height="7" fill="#f07a24"/><circle cx="324" cy="588" r="9" fill="#22262b"/><circle cx="506" cy="588" r="9" fill="#22262b"/><text x="351" y="472" font-family="WenQuanYi Zen Hei, IPAGothic, sans-serif" font-size="14" fill="#0b4a6b" font-weight="bold" text-anchor="middle">100%</text><text x="415" y="620" font-family="WenQuanYi Zen Hei, IPAGothic, sans-serif" font-size="15" fill="#2b2f36" font-weight="bold" text-anchor="middle">主机</text><text x="490" y="506" font-family="WenQuanYi Zen Hei, IPAGothic, sans-serif" font-size="11" fill="#f6b37f" font-weight="normal" text-anchor="middle">L14-30R</text><path d="M490,468 C560,470 586,420 560,396 C540,378 520,404 500,384 C490,374 478,370 466,368" fill="none" stroke="#b8bec7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 10"/><text x="424" y="404" font-family="WenQuanYi Zen Hei, IPAGothic, sans-serif" font-size="13" fill="#5c6673" font-weight="normal" text-anchor="end">Power Output Cable Kit（L14-30）</text><path d="M128,542 C190,566 250,566 300,540" fill="none" stroke="#1e9e4a" stroke-opacity=".22" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><path d="M128,542 C190,566 250,566 300,540" fill="none" stroke="#1e9e4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="222" y="584" font-family="WenQuanYi Zen Hei, IPAGothic, sans-serif" font-size="12" fill="#5c6673" font-weight="normal" text-anchor="middle">主机另接墙插充电</text><rect x="288.95" y="630" width="252.1" height="30" rx="15" fill="#1e9e4a"/><text x="415" y="650" font-family="WenQuanYi Zen Hei, IPAGothic, sans-serif" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">主机经墙插充电，AC 输出开着待命</text></g><text x="470" y="1572" font-family="WenQuanYi Zen Hei, IPAGothic, sans-serif" font-size="18" fill="#2b2f36" font-weight="normal" text-anchor="middle">主机在旁边待命：电网经分电盘直接给备电回路供电，主机不在这条路上；</text><text x="470" y="1602" font-family="WenQuanYi Zen Hei, IPAGothic, sans-serif" font-size="18" fill="#2b2f36" font-weight="normal" text-anchor="middle">停电时分电盘 10～200 ms 内切到主机 L14-30 输出。主机另接墙插充电。</text></svg>
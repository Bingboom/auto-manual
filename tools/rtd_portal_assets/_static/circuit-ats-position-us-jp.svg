<svg xmlns="http://www.w3.org/2000/svg" width="940" height="1650" viewBox="0 0 940 1650"><rect width="940" height="1650" fill="#ffffff"/><text x="20" y="44" font-family="WenQuanYi Zen Hei, IPAGothic, sans-serif" font-size="28" fill="#1f2328" font-weight="bold" text-anchor="start">主机在电路里的位置：美国 Jackery ATS 与日本切替分電盤</text><text x="20" y="76" font-family="WenQuanYi Zen Hei, IPAGothic, sans-serif" font-size="16" fill="#6e7781" font-weight="normal" text-anchor="start">平时（有电网）的接法示意，不是施工图。蓝线为电网供电，灰虚线为待命线路。</text><text x="20" y="100" font-family="WenQuanYi Zen Hei, IPAGothic, sans-serif" font-size="16" fill="#6e7781" font-weight="normal" text-anchor="start">具体接法以各地区说明书和切替分電盤说明书为准。</text><g transform="translate(20,120)"><rect x="0" y="0" width="900" height="660" rx="22" fill="#eef1f4"/><rect x="0" y="588" width="900" height="72" fill="#d6dbe1"/><text x="32" y="48" font-family="WenQuanYi Zen Hei, IPAGothic, sans-serif" font-size="30" fill="#2b2f36" font-weight="bold" text-anchor="start">美国</text><rect x="326.6" y="22" width="466.79999999999995" height="30" rx="15" fill="#1f7ae0"/><text x="560" y="42" font-family="WenQuanYi Zen Hei, IPAGothic, sans-serif" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle">电网 → ATS → 主机（旁路）→ ATS → 备电回路</text><path d="M205,70 L205,128" fill="none" stroke="#1f7ae0" stroke-opacity=".22" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><path d="M205,70 L205,128" fill="none" stroke="#1f7ae0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="222" y="76" font-family="WenQuanYi Zen Hei, IPAGothic, sans-serif" font-size="15" fill="#5c6673" font-weight="bold" text-anchor="start">电网</text><rect x="120" y="128" width="170" height="112" rx="8" fill="#fbfbfc" stroke="#9aa3ad" stroke-width="2"/><rect x="140" y="176" width="130" height="10" rx="3" fill="#c9cfd6"/><text x="205" y="262" font-family="WenQuanYi Zen Hei, IPAGothic, sans-serif" font-size="15" fill="#5c6673" font-weight="bold" text-anchor="middle">主配电盘（原有）</text><path d="M120,160 L64,160 L64,196" fill="none" stroke="#1f7ae0" stroke-opacity=".22" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M120,160 L64,160 L64,196" fill="none" stroke="#1f7ae0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="22" y="196" width="84" height="34" rx="8" fill="#fff" stroke="#8a95a3" stroke-width="2"/><line x1="32" y1="220" x2="96" y2="220" stroke="#a3adb9" stroke-width="2"/><path d="M40,238 q7,10 0,20 M64,238 q7,10 0,20 M88,238 q7,10 0,20" fill="none" stroke="#7cc4ff" stroke-width="3" stroke-linecap="round"/><text x="64" y="282" font-family="WenQuanYi Zen Hei, IPAGothic, sans-serif" font-size="14" fill="#5c6673" font-weight="normal" text-anchor="middle">空调</text><path d="M290,180 L380,180" fill="none" stroke="#1f7ae0" stroke-opacity=".22" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><path d="M290,180 L380,180" fill="none" stroke="#1f7ae0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="380" y="112" width="170" height="150" rx="12" fill="#3b4048" stroke="#1d2126" stroke-width="2"/><rect x="400" y="130" width="72" height="34" rx="4" fill="#9fe0ff"/><rect x="380" y="244" width="170" height="7" fill="#f07a24"/><text x="436" y="153" font-family="WenQuanYi Zen Hei, IPAGothic, sans-serif" font-size="13" fill="#0b4a6b" font-weight="bold" text-anchor="middle">UPS</text><text x="512" y="154" font-family="WenQuanYi Zen Hei, IPAGothic, sans-serif" font-size="13" fill="#f6b37f" font-weight="bold" text-anchor="middle">Jackery</text><text x="465" y="210" font-family="WenQuanYi Zen Hei, IPAGothic, sans-serif" font-size="22" fill="#ffffff" font-weight="bold" text-anchor="middle">ATS</text><text x="465" y="100" font-family="WenQuanYi Zen Hei, IPAGothic, sans-serif" font-size="15" fill="#9a6a12" font-weight="bold" text-anchor="middle">Jackery ATS（另售）</text><path d="M550,150 L680,150 L680,120 L760,120" fill="none" stroke="#1f7ae0" stroke-opacity="
</text><rect x="302.25" y="630" width="225.5" height="30" rx="15" fill="#1f7ae0"/><text x="415" y="650" font-family="WenQuanYi Zen Hei, IPAGothic, sans-serif" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">主机串在电路中间，平时就在旁路</text></g><text x="470" y="812" font-family="WenQuanYi Zen Hei, IPAGothic, sans-serif" font-size="18" fill="#2b2f36" font-weight="normal" text-anchor="middle">主机串在中间：电网经 ATS 进主机，旁路后再经 ATS 给备电回路供电；</text><text x="470" y="842" font-family="WenQuanYi Zen Hei, IPAGothic, sans-serif" font-size="18" fill="#2b2f36" font-weight="normal" text-anchor="middle">停电时主机直接改由电池供电（≤20 ms，ATS UPS 模式）。</text><g transform="translate(20,880)"><rect x="0" y="0" width="900" height="660" rx="22" fill="#eef1f4"/><rect x="0" y="588" width="900" height="72" fill="#d6dbe1"/><text x="32" y="48" font-family="WenQuanYi Zen Hei, IPAGothic, sans-serif" font-size="30" fill="#2b2f36" font-weight="bold" text-anchor="start">日本</text><rect x="417.8" y="22" width="284.4" height="30" rx="15" fill="#1f7ae0"/><text x="560" y="42" font-family="WenQuanYi Zen Hei, IPAGothic, sans-serif" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle">电网 → 切替分電盤 → 备电回路</text><path d="M205,70 L205,128" fill="none" stroke="#1f7ae0" stroke-opacity=".22" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><path d="M205,70 L205,128" fill="none" stroke="#1f7ae0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="222" y="76" font-family="WenQuanYi Zen Hei, IPAGothic, sans-serif" font-size="15" fill="#5c6673" font-weight="bold" text-anchor="start">电网</text><rect x="120" y="128" width="170" height="112" rx="8" fill="#fbfbfc" stroke="#9aa3ad" stroke-width="2"/><rect x="140" y="176" width="130" height="10" rx="3" fill="#c9cfd6"/><text x="205" y="262" font-family="WenQuanYi Zen Hei, IPAGothic, sans-serif" font-size="15" fill="#5c6673" font-weight="bold" text-anchor="middle">住宅分电盘（原有）</text><path d="M120,160 L64,160 L64,196" fill="none" stroke="#1f7
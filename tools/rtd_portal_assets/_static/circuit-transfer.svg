<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-label="典型联锁双电源切换电路"><style>text{font-family:system-ui,sans-serif;font-size:18px;fill:#26313b}.wire{fill:none;stroke:#394b5a;stroke-width:2.5}.ctrl{fill:none;stroke:#cf590c;stroke-width:2;stroke-dasharray:6 5}.part{fill:#fff;stroke:#394b5a;stroke-width:2}.note{font-size:15px;fill:#626d77}.node{fill:#394b5a}</style><text x="25" y="30" class="">典型双电源切换：两组触点联动，先断后合</text><text x="25" y="85" class="">市电 L</text><text x="25" y="165" class="">逆变 L</text><path class="wire" d="M120 100 H365 M120 170 H365 M390 135 H780"/><circle class="part" cx="365" cy="100" r="5"/><circle class="part" cx="365" cy="170" r="5"/><path class="wire" d="M390 135 L370 105"/><circle class="node" cx="390" cy="135" r="4"/><text x="515" y="122" class="">输出 L</text><text x="25" y="235" class="">市电 N</text><text x="25" y="315" class="">逆变 N</text><path class="wire" d="M120 250 H365 M120 320 H365 M390 285 H780"/><circle class="part" cx="365" cy="250" r="5"/><circle class="part" cx="365" cy="320" r="5"/><path class="wire" d="M390 285 L370 255"/><circle class="node" cx="390" cy="285" r="4"/><text x="515" y="272" class="">输出 N</text><path class="wire" d="M780 135 V190 M780 245 V285"/><rect class="part" x="764" y="190" width="32" height="55"/><text x="815" y="225" class="">AC 负载</text><path class="ctrl" d="M380 136 V280"/><text x="410" y="220" class="note">联锁控制</text><text x="25" y="380" class="">市电正常：触点选择市电；市电失效：断开市电，再接入逆变供电。</text><text x="25" y="415" class="note">图示为双极切换的教学例子；实际 N 是否切换、PE 与 N 的连接按系统接地设计。</text><text x="25" y="445" class="note">ATS 自动决定切换；MTS 由人工选位。备电切换不等于允许向电网反送电。</text></svg>
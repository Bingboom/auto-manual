<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-label="典型中心抽头 120/240V 分相交流电路"><style>text{font-family:system-ui,sans-serif;font-size:18px;fill:#26313b}.wire{fill:none;stroke:#394b5a;stroke-width:2.5}.ctrl{fill:none;stroke:#cf590c;stroke-width:2;stroke-dasharray:6 5}.part{fill:#fff;stroke:#394b5a;stroke-width:2}.note{font-size:15px;fill:#626d77}.node{fill:#394b5a}</style><text x="25" y="30" class="">典型美式 120/240V 分相：两端与中点的电压关系</text><text x="25" y="80" class="">中心抽头交流源示例</text><text x="25" y="105" class="note">（非产品内部拓扑认定）</text><path class="wire" d="M180 90 H280 M180 90 c-30 0 -30 26 0 26 c-30 0 -30 26 0 26 c-30 0 -30 26 0 26 c-30 0 -30 26 0 26 M180 194 H280 M180 194 c-30 0 -30 26 0 26 c-30 0 -30 26 0 26 c-30 0 -30 26 0 26 c-30 0 -30 26 0 26 M180 298 H280"/><path class="wire" d="M280 90 H885 M280 194 H885 M280 298 H885"/><text x="290" y="75" class="">L1</text><text x="290" y="180" class="">N</text><text x="290" y="325" class="">L2</text><path class="wire" d="M465 90 V124.0 M465 160.0 V194"/><rect class="part" x="453" y="124.0" width="24" height="36"/><text x="487" y="147.0" class="">120V</text><circle class="node" cx="465" cy="90" r="4"/><circle class="node" cx="465" cy="194" r="4"/><path class="wire" d="M655 194 V228.0 M655 264.0 V298"/><rect class="part" x="643" y="228.0" width="24" height="36"/><text x="677" y="251.0" class="">120V</text><circle class="node" cx="655" cy="194" r="4"/><circle class="node" cx="655" cy="298" r="4"/><path class="wire" d="M850 90 V176.0 M850 212.0 V298"/><rect class="part" x="838" y="176.0" width="24" height="36"/><text x="872" y="199.0" class="">240V</text><circle class="node" cx="850" cy="90" r="4"/><circle class="node" cx="850" cy="298" r="4"/><text x="25" y="385" class="">L1–N 与 L2–N 各 120V；L1 与 L2 相位相反，L1–L2 为 240V。</text><text x="25" y="420" class="note">每相及单口有各自限制；240V 插座不会凭空增加逆变器总功率。</text></svg>
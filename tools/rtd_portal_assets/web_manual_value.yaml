# 「网页说明书的定位与价值」: one copy source for the 说明书资料库 home band and
# the internal page workspace/positioning/index. tools/rtd/web_manual_value.py
# reads this file; a malformed file fails the build.
#
# The home page is shared by two RTD projects, so the copy has two audiences:
#   public    the band on the public manuals project (RTD_SITE_ROLE=manuals):
#             only what a reader can use today. No internal names, governance or
#             AI wording, and no links into the knowledge base. Only this block
#             reaches public HTML.
#   internal  the band on the private site's home and the full page.
#
# Each theme lists its facets with a status from system_workspace.yaml's
# vocabulary: available | validated | in_progress | planned (a planned facet
# names its REV). The theme's tag is derived from its facets: all available is
# 可用; any available or validated is 部分可用; all planned is 已规划; otherwise
# 建设中. `revs` are evidence for reviewers and are never shown. State only
# what exists or is being built, keep each line short, and write no counts:
# they change with every release, and 说明书工作台 reads them from the publish
# manifest.
schema: hello-docs-web-manual-value/v1
title: 网页说明书的定位与价值

public:
  lead: 网页说明书以已批准的产品说明书为依据，在不改变技术事实的前提下，提供更方便查找和阅读的网页版本。
  points:
    - title: 便捷阅读
      text: 统一的版式和章节导航，手机和电脑都能读，可按型号、产品名称或正文搜索。
    - title: 版本清楚
      text: 每份说明书都标明型号、适用市场和语言。
    - title: 持续更新
      text: 新的产品和语言版本陆续上线，内容修订后发布新版本。

internal:
  eyebrow: HELLO-DOCS · DIGITAL MANUAL LIBRARY
  heading: 人能读，机器能读，团队能持续复用
  subtitle: 网页说明书是已批准说明书的可信发布源：同一份内容，服务用户、客服、AI 助手和资料开发。
  tagline: 网页说明书是已批准说明书的可信发布源：人能读，机器能读，团队能持续维护和复用。
  intro:
    - 它不只是纸质说明书的网页版，也是产品内容走向数字化管理、机器可读和知识积累的载体。
  key_idea: 已批准的历史内容，不天然等于可直接复用的标准知识。
  triad:
    - 网页化解决可访问性
    - 机读解决可引用性
    - 内容治理解决可信性
    - 知识沉淀解决复用价值
  themes:
    - id: reading
      theme: 便捷阅读
      title: 更便捷的数字化阅读
      body:
        - 以已批准的说明书为依据，用统一的版式、章节导航和检索，让用户在手机和电脑上都能快速找到、读懂产品信息。
      principle: 忠实于已批准的原稿，不改变技术事实。
      facets:
        - label: 统一呈现
          status: available
          note: 共享组件和统一主题，按章节导航。
        - label: 扫码直达
          status: available
          note: 包装上的二维码直接打开对应型号的网页版。
        - label: 快速查阅
          status: available
          note: 手机电脑都能读，可切换语言，可按型号、名称或正文搜索。
    - id: machine
      theme: 机器可读
      title: 可准确引用的机读内容
      body:
        - 网页说明书同时生成结构化的机读内容，附版本和校验信息。AI 助手和业务系统按来源引用，而不是凭记忆作答。
      principle: 机器引用的必须是已发布版本，来源和版本可以核对。
      facets:
        - label: 机读导出
          status: available
          note: 发布时导出机读内容和校验回执。
        - label: AI 问答
          status: available
          note: 钉钉问答机器人已在用：先校验，再按机读内容作答。
        - label: 市场覆盖
          status: in_progress
          note: 目前只有欧规；内容从网页提取，尚非同源生成。
    - id: governance
      theme: 内容治理
      title: 可追溯的产品内容资产
      body:
        - 每个版本都保留型号、市场、语言、来源和版本信息；修订后直接发布新版本，不用等重印。网页化中发现的差异作为改进线索，核验后按需处理，不要求全面重写。
      principle: 保留历史依据，识别内容差异，让资料具备持续治理的基础。
      facets:
        - label: 版本追溯
          status: available
          note: 发布清单登记每个网页版的型号、市场、语言和版本。
        - label: 读者反馈
          status: available
          note: 每页都有售后反馈入口，站点有访问统计。
        - label: 质量改进
          status: in_progress
          note: 差异台账和核验工具已有，全量验收未完成。
    - id: knowledge
      theme: 知识积累
      title: 可持续积累的知识资产
      body:
        - 术语、通用内容、图文组件和写作经验逐步积累。已发布的历史内容经来源核验和审核后，才沉淀为可复用的模板和标准表达，辅助资料开发人员与 AI Agent。
      principle: 以已批准内容为依据，以审核后的知识指导未来，而不是简单复制历史资料。
      facets:
        - label: 规范沉淀
          status: in_progress
          note: 写作规则、共享组件和批准措辞经人确认后沉淀。
          revs: [REV-48]
        - label: 可信复用
          status: in_progress
          note: 工作台复用现有数据、模板和语料写审核稿，由人审核。
          revs: [REV-47]
        - label: 辅助创作
          status: in_progress
          note: 写稿 Agent 在工作台出审核稿，由人审阅。
          revs: [REV-47]

      summary: 经审核的术语、组件和写作经验沉淀下来，用于开发新说明书。
      facets:
        - label: 规范沉淀
          status: in_progress
          note: 写作规则、共享组件和批准措辞经人确认后沉淀。
          revs: [REV-48]
        - label: 可信复用
          status: in_progress
          note: 工作台复用现有数据、模板和语料写审核稿，由人审核。
          revs: [REV-47]
        - label: 辅助创作
          status: in_progress
          note: 写稿 Agent 在工作台出审核稿，由人审阅。
          revs: [REV-47]

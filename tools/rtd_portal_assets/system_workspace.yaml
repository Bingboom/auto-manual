        evidence:
          - "pr:auto-manual#1057"
          - "file:auto-manual:code-as-doc/dev/ir_document_closeout.md"
          - "file:auto-manual:code-as-doc/dev/manual_ir_p1_decisions_2026-11.md"
          - "file:auto-manual:code-as-doc/dev/shared_ir_bitable_indesign_plan.md"
      - id: idml
        label: 印刷交付（直接改 .ai / IDML 冻结）
        short: .ai / IDML
        status: in_progress
        verified_on: 2026-11-25
        note: 印刷主线是按审核稿或语料直接修改现存 .ai 印刷稿（原位改文字，刀版、出血与版面不动）；旧 RST→IDML 路径保留但冻结，「网页共享 IR + 飞书多维表上传无字底图 → InDesign」方案暂挂为远期备选

# System Workspace status contract: the curated half of /workspace/system/.
#
# The page's site is private for now (Read the Docs for Business, since
# 2026-10-13), but the operator can make it public at any time, and this file
# sits in a public repository — write only what may be published. Internal
# framing (gap narrative, resource needs) belongs to the Feishu internal page.
# Numbers never appear in this file: every figure on the page is computed at
# build time from docs/publish/publish_manifest.json, the execution ledger, the
# corpus snapshot or the skeleton blueprints under docs/manifests/skeletons.
#
# Evidence grammar (checked by `python tools/rtd/system_workspace.py check`):
#   pr:<repo>#<n>             merged pull request (verified with --online)
#   file:<repo>:<path>        file or directory on main
#   url:<https-url>           page answering 200 (verified with --online)
#   rev:<REV-nn>=<status>     execution-ledger row and the status it had when verified
#   ack:<who> <YYYY-MM-DD>「…」 operator confirmation; never an entry's only evidence
# See code-as-doc/dev/rtd_manual_portal/system-workspace.md#system-workspace-page for the rules.
#
# Where each figure comes from, how often entries are re-reviewed, the snapshot
# files and what shows when a source cannot be read are registered once, in
# source_registry.yaml next to this file, not here.

schema: hello-docs-system-workspace/v1
verified_on: 2026-09-24

repositories:
  auto-manual: https://github.com/Bingboom/auto-manual
  hello-docs: https://github.com/Bingboom/Hello-Docs

vocabulary:
  status:
    available: 已在生产使用，有线上或交付产物、持续运行记录
    validated: 在代表目标上跑通并有验收记录，覆盖尚未铺开
    in_progress: 已有合入的实现，验收或覆盖未完成
    planned: 已登记在方案或台账（须引用 REV 编号），尚无实现
    blocked: 有已知阻塞，须写明阻塞项与重启条件
    retired: 已停用或撤回；不计入能力，不上公开页
    no_data: 没有可追溯的数据源；不显示数字
  mode:
    automated: 环节之间自动衔接，不需要人工搬运
    manual: 能走通，但需要人工触发或衔接
  # 生产链路 shows the flow links in these groups, in this order.
  flow_group:
    produce: 生产
    language: 翻译与评审
    operate: 运行与追溯

hero:
  title: Hello Docs
  # The headline of step 12 of the 2026-11 redesign (positioning §1.2). The operator's 「都按建议」 of 2026-11-16
  # answered the step-12 design decisions, this headline among them. The same day, at the operator's request, its
  # last clause (产品信息排第一) was removed.
  subtitle: 以网页说明书为入口，把产品信息、内容与表现、视觉媒体、语言管成有来源、可核实的资产。
  evidence:
    - "file:auto-manual:code-as-doc/dev/manual_revitalization_execution.md"
    - "ack:操作者 2026-11-16「都按建议」"
    - "file:auto-manual:code-as-doc/architecture/Hello_Docs_Positioning.md"

# Current focus decides the page order: lanes marked now come first, next
# after, and the cards and gates they name carry the lane's tag. A lane's
# figures come from the corpus snapshot or the skeleton blueprints (one
# skeleton per skeleton_id); its progress from the ledger gates or rows it
# lists. Publication counts (publications, regions) belong to 说明书工作台, so
# no lane lists them; the page points there instead. The focus is the
# operator's call: re-confirm it whenever verified_on moves.
#
# doing is 正在做: the one list that both this page (当前工作) and 知识库首页
# show, in the operator's plain words, each item tied to a lane marked now.
# The ledger's open rows stay on the 阶段门 and in the lane cards.
focus:
  note: 资料写作在工作台进行，网页发布与维护闭环是交付主线；语料与 SSOT 随实际需求补齐。基于数据和模板的自动构建正在退出，共享与覆盖逐步扩展。
  evidence:
    - "file:auto-manual:code-as-doc/dev/manual_revitalization_execution.md"
    - "ack:夏冰 2026-09-26「按这个顺序 当下的系统建设布局 做一下 更清晰的布局版面的调整」"
    - "ack:操作者 2026-10-12「好，写成 REV-41 决定记录开 PR」"
    - "ack:操作者 2026-10-19「REV-39 暂缓」"
    - "ack:操作者 2026-10-23「基于数据+模版 自动构建 这个过程 可以 退却为 按需使用了 我需要 把 Hello-Docs-Review工作台推出」"
    - "ack:操作者 2026-10-23「公开系统建设页的「当前重点」要不要加上工作台？ === 加」"
    - "ack:操作者 2026-11-05「长在做 不要写这俩 就写 持续转网页文档 还有就是 基于 持续积累的语料+图标 实现基于agent的多格式输出 这种文字」"
    - "ack:操作者 2026-11-06「这里 没和首页 统一」"
    - "ack:操作者 2026-11-06「逐步收缩，写进定位文档」"
    # 2026-11-24 print route decision (Web documents + direct .ai editing; InDesign plan on hold), recorded with its
    # 2026-11-25 review confirmation in the ledger decision log (REV-55; REV-20, REV-26, REV-40 deferred).
    - "ack:操作者 2026-11-25「都按建议」"
    # 2026-11-16 the operator decided the data-and-template route exits (退出), recorded in the positioning document
    # (§4.1) and the ledger's scope-change row; the 2026-11-06 quote above stays as it was said.
    - "file:auto-manual:code-as-doc/architecture/Hello_Docs_Positioning.md"
  doing:
    - {lead: 网页化, text: 印刷版说明书与审核稿持续转成网页版, lane: web}
    - {lead: 多格式输出, text: Agent 复用语料与审核稿，产出网页文档并直接修改现存 .ai 印刷稿, lane: workbench}
  lanes:
    - id: workbench
      horizon: now
      title: 资料开发工作台
      goal: 在 Hello-Docs-Review 调用现有的基础设施、数据、模板和语料写作，由人审核；自动构建正在退出
      action: 用参考稿复用写作技能出审核稿、在私有审核站审阅；审核稿转网页候选及差异追踪已启动（REV-48）；印刷主线是按审核稿或语料直接修改现存 .ai 印刷稿（REV-55）；并行写稿按 REV-47 规则（一条稿线一个写者、写稿会话对公开仓库只读）执行
      items: [agent_operations.workbench]
      metrics: [reviews]
      revs: [REV-47, REV-48, REV-55]
    - id: web
      horizon: now
      title: 网页发布与维护闭环
      goal: 先收口发布基线，再用真实修订验证发布、恢复与维护全过程
      action: 完成 REV-09 修订、发布与恢复演练 → 验收 G1 → 开始 G2 维护试点
      card: web_publishing
      metrics: [capabilities]
      gates: [G1, G2]
    - id: corpus
      horizon: support
      title: 语料库建设与管理
      goal: 围绕下一批明确的型号、区域和语言补译、审核，让语料服务实际交付
      action: 用 REV-18 记录真实命中与人工修正；以复用质量验证收益，不以句对数量代替验收
      card: language
      metrics: [corpus]
      revs: [REV-11, REV-18, REV-35..REV-38]
    - id: ssot
      horizon: support
      title: 来源登记（SSOT） · 贯穿全程
      goal: 每碰到一类实际数据，就明确来源、写入者、批准者和发布快照
      action: 按需求扩展现有来源登记；无需先建完所有事实域、任务状态和审批系统
      items: [agent_operations.source_registry]
      metrics: [sources]
      revs: [REV-44]
    - id: shared_ir
      horizon: deferred
      title: Shared IR（共享底稿 · 远期备选挂起）
      goal: Web 整本 Shared IR 已落地；跨格式延伸至「网页共享 IR + 飞书多维表上传无字底图 → InDesign」暂挂为远期备选储备
      action: REV-39 保持暂缓；shared_ir_bitable_indesign_plan.md 于 2026-11-24 决定挂起，IDML/InDesign 整条线冻结，REV-20、REV-40 同步暂缓（当前零研发投入）；印刷主线是按审核稿或语料直接修改现存 .ai 印刷稿（REV-55）。重启条件（任一满足即复评）：REV-20 或 REV-40 开工、启动共享层收敛、共享修改因缺少公共语义契约无法可控地传到已冻结的整本包、出现没有现存 .ai 母版的新产品线、多语种重排成为明显的人力瓶颈；IDML 验收不阻塞 Web 交付
      card: document_production
      items: [document_production.shared_ir]
      revs: [REV-39..REV-40]
    - id: skeletons
      horizon: deferred
      title: 骨架扩展 · 按条件再启动
      goal: 保留并维护已建成的骨架；网页覆盖不再以扩展骨架为前提
      action: 新一轮拓展暂缓（REV-41 决定）；新品没有定稿印刷稿、需要由管线出印刷稿、1.0 之后同一修正反复跨多本，或原生接入新线成本过高时再复评
      card: content_foundation
      items: [content_foundation.skeletons]
      metrics: [skeletons]
      revs: [REV-41..REV-43]
    - id: multi_agent
      horizon: deferred
      title: 工作台协作 · 按试点再启动
      goal: 多 agent 写稿已在工作台发生；认领与交接工具暂不建设
      items: [agent_operations.agent_dispatch]
      action: 先按 REV-47 的规则运行（一条稿线一个写者、写稿会话对公开仓库只读）；首个并行试点显示认领或交接成为瓶颈时，再评估重启 REV-45；不作为网页、语料、SSOT 或 Shared IR（共享底稿）的前置条件
  regions: {EU: 欧规, US: 美规, UK: 英规, JP: 日规, KR: 韩规, CN: 中规, AU: 澳规, BR: 巴西规, TW: 台规}
  skeleton_families:
    - {family: MAIN, label: 便携电源}
    - {family: BP, label: 电池包}
    - {family: SOLAR, label: 太阳能板}
    - {family: CHARGER, label: 充电器}

capabilities:
  - id: web_publishing
    title: 网页发布
    en: Web Publishing
    status: available
    summary: 网页说明书按产品、市场、语言浏览；每次发布有版本和回执，每天自动校验
    items:
      - id: manual_center
        label: 说明书资料库
        status: available
        note: 按产品、区域、语言进入网页说明书
        evidence:
          - "url:https://ht-docs-ht-manuals.readthedocs-hosted.com/en/latest/"
          - "file:auto-manual:tools/rtd/portal.py"
      - id: search
        label: 站内搜索
        status: available
        note: 按手册目录和章节关键词搜索
        evidence:
          - "pr:auto-manual#1133"
      - id: locale_nav
        label: 语言切换
        status: available
        note: 同一本说明书在各语言版本之间跳转
        evidence:
          - "pr:auto-manual#1073"
      - id: receipt
        label: 版本与部署回执
        status: available
        note: 线上内容与发布源逐文件对应，可回查到提交
        evidence:
          - "pr:auto-manual#1127"
          - "url:https://ht-docs-ht-manuals.readthedocs-hosted.com/en/latest/manual-deployment.json"
      - id: daily_check
        label: 每日部署校验
        status: available
        note: 每天核对线上页面与发布源是否一致，出错自动开告警
        evidence:
          - "pr:auto-manual#1192"
          - "pr:auto-manual#1193"
          - "rev:REV-08=done"
          - "file:auto-manual:.github/workflows/verify-web-deployment.yml"
      - id: qr_entry
        label: 印刷二维码入口
        status: available
        note: 印刷说明书上的二维码进入对应网页说明书，可单独统计
        evidence:
          - "pr:auto-manual#1160"
      - id: analytics
        label: 访问统计
        status: available
        note: 按入口和页面统计访问
        evidence:
          - "pr:auto-manual#1155"
          - "pr:auto-manual#1163"

  - id: language
    title: 语言资产
    en: Language Intelligence
    status: in_progress
    summary: 术语、句对和翻译规则逐步沉淀为可维护、可复用的语言资产
    items:
      - id: translation_memory
        label: 翻译记忆库
        status: available
        note: 句对与术语集中在一个记忆库，构建和翻译都从这里取
        evidence:
          - "pr:auto-manual#521"
          - "file:auto-manual:.agents/skills/bitable-translation-memory/SKILL.md"
          - "file:auto-manual:tools/rtd_portal_assets/system_workspace_corpus.json"
      - id: short_copy
        label: 短文案自动取译文
        status: available
        note: 页面短文案按键从记忆库取对应语言，构建时写入
        evidence:
          - "file:auto-manual:tools/word/bundle_common.py"
      - id: correction_reflow
        label: 评审修正回收入库
        status: validated
        note: 评审中的修正整理成候选，经语言负责人审核后入库并回读
        evidence:
          - "pr:auto-manual#518"
          - "rev:REV-11=done"
      - id: pretranslation
        label: 文档预翻译
        status: in_progress
        note: 按需交付高亮 Word 副本时按记忆库预填，剩余交人工。真实命中与修正记录尚待验收
        evidence:
          - "pr:auto-manual#371"
          - "pr:auto-manual#746"
          - "rev:REV-18=planned"
      - id: terminology
        label: 术语检查
        status: in_progress
        note: 构建检查按术语规则拦截不合规写法，日语规则已接入
        evidence:
          - "pr:auto-manual#1222"
          - "file:auto-manual:data/terminology_rules.csv"

  - id: document_production
    title: 多格式生产
    en: Document Production
    status: in_progress
    summary: 网页文档是主要交付形态，印刷主线是直接修改现存 .ai 印刷稿；PDF、Word 按需产出，IDML 保留但冻结，Shared IR 转 InDesign 暂挂
    items:
      - id: web
        label: 网页手册
        short: 网页
        status: available
        note: 网页说明书为主力交付形态，由构建发布与审核稿转网页候选路径共同支撑

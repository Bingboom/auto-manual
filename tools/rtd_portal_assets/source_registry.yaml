# Source registry (SSOT, REV-44): where each fact on the workspace pages comes
# from, how fresh it must be, and what shows when it cannot be read. Design:
# code-as-doc/dev/ssot_source_registry_design.md.
#
# The system and deliverables pages read snapshot names, freshness limits and
# fallback text from here instead of hardcoding them; the system page lists
# every domain as 数据来源; agents look up a fact's authority here.
# Name Feishu sources by their environment variables, never by token. This
# file sits in a public repository, and the pages' site, private since
# 2026-10-13 (Read the Docs for Business), can be made public at any time.
#
#   authority        where the fact is decided: a file:<repo>:<path> ref, or text
#   read             build (read at build time) | snapshot (a committed JSON file)
#   snapshot         the snapshot next to this file (snapshot domains only)
#   refresh          the read-only command that rewrites the snapshot
#   stale_after_days snapshot age, or review cycle, after which the page shows 待复核
#   fallback         what the page shows when the source cannot be read
#   used_by          the page blocks that show this fact
schema: hello-docs-source-registry/v1

domains:
  - id: publications
    label: 发布目标
    authority: "file:hello-docs:docs/publish/publish_manifest.json"
    read: build
    fallback: 发布清单当前不可读
    used_by: 说明书工作台的网页手册列与发布规模、系统数据、产品矩阵

  - id: ledger
    label: 执行进度
    authority: "file:auto-manual:code-as-doc/dev/manual_revitalization_execution.md"
    read: build
    fallback: 执行台账当前不可读
    used_by: 当前重点的进度、阶段门、当前在做

  - id: corpus
    label: 语料规模
    authority: 飞书翻译记忆库（$FEISHU_TRANSLATION_MEMORY_BASE_TOKEN）
    read: snapshot
    snapshot: system_workspace_corpus.json
    refresh: python tools/workspace_refresh.py refresh corpus
    stale_after_days: 7
    fallback: 语料快照当前不可读
    used_by: 语言资产

  - id: deliverables_feishu
    label: 交付物飞书链接
    authority: 飞书文档构建表与 Document_key 表（$FEISHU_PHASE2_BASE_TOKEN）
    read: snapshot
    snapshot: deliverables_snapshot.json
    refresh: python tools/workspace_refresh.py refresh deliverables
    stale_after_days: 3
    fallback: 飞书快照当前不可读
    used_by: 说明书工作台的印刷交付包、Word 云文档两列

  - id: skeletons
    label: 骨架覆盖
    authority: "file:auto-manual:docs/manifests/skeletons"
    read: build
    fallback: 无数据
    used_by: 当前重点·骨架拓展

  - id: tooling
    label: 技能与钩子
    authority:
      - "file:auto-manual:.agents/skills"
      - "file:auto-manual:.claude/skills"
      - "file:auto-manual:.claude/settings.json"
      - "file:auto-manual:.githooks/pre-push"
    read: build
    fallback: 不显示这一块
    used_by: 系统建设·工具与工程规模

  - id: capabilities
    label: 能力状态
    authority: "file:auto-manual:tools/rtd_portal_assets/system_workspace.yaml"
    read: build
    stale_after_days: 30
    fallback: 待复核
    used_by: 能力地图、生产流程与连接

  - id: focus
    label: 当前重点
    authority:
      - 操作者决定
      - "file:auto-manual:tools/rtd_portal_assets/system_workspace.yaml"
      - "file:auto-manual:code-as-doc/dev/manual_revitalization_execution.md"
    read: build
    fallback: 不显示这一块
    used_by: 当前重点

  - id: evolution
    label: 系统演变
    authority: "file:auto-manual:code-as-doc/architecture/system_evolution_history.md"
    read: build
    fallback: 系统演变记录当前不可读，请查看仓库演进史
    used_by: 系统演变标签页；历史快照与未来方向

  - id: codebase
    label: 工程规模
    authority: 构建时检出的 git ls-files
    read: build
    fallback: git 文件清单当前不可读
    used_by: 系统建设·工具与工程规模

  # Sources of the 系统数据, 产品矩阵 and 知识库首页 pages, and of the navigation groups the
  # manual-library homepage and 产品知识 share. Those pages do not read this file; fallback says what they show.
  - id: capability_table
    label: 机型能力与语言
    authority:
      - "file:auto-manual:data/model_capabilities.csv"
      - "file:auto-manual:data/model_languages.csv"
    read: build
    fallback: 系统数据页和产品矩阵页不生成，构建时告警
    used_by: 产品矩阵·功能矩阵、系统数据·机型能力

  - id: asset_registry
    label: 素材登记
    authority: "file:auto-manual:data/asset_registry.csv"
    read: build
    fallback: 系统数据页不生成，构建时告警
    used_by: 系统数据·素材

  - id: product_positioning
    label: 产品线与定位
    authority:
      - "file:auto-manual:tools/rtd_portal_assets/settings.json"
      - "file:auto-manual:tools/rtd_portal_assets/product_matrix.json"
    read: build
    fallback: settings.json 不可读则整站构建失败；product_matrix.json 不可读则产品矩阵页不生成
    used_by: 说明书资料库分组、产品知识、产品矩阵

  - id: product_specs
    label: 产品规格
    authority: 已发布网页说明书的规格表（随构建从冻结目录读取）
    read: build
    fallback: 该型号的规格显示为 —
    used_by: 产品矩阵

  - id: knowledge_updates
    label: 知识库更新记录
    authority: "file:auto-manual:tools/rtd_portal_assets/knowledge_updates.yaml"
    read: build
    fallback: 有问题的条目不显示、缺日期的条目显示日期未记录，构建时告警；文件不可读时显示暂无更新记录
    used_by: 知识库首页·最近更新

  - id: review_pages
    label: 评审页面
    authority: "file:auto-manual:docs/_review"
    read: build
    fallback: 评审页数记为 0
    used_by: 系统数据

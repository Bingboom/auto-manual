# 知识库首页「最近更新」(#updates): one entry per knowledge-page change a reader
# should notice, newest first. tools/rtd/knowledge_updates.py reads this file;
# the page shows the newest 8 entries whose page this build made.
#
# No build-time source carries per-page change dates (the data dates measure
# freshness, which 说明书工作台 and 系统建设 already show), so the list is
# curated: a PR that adds a knowledge page or changes one noticeably adds its
# entry here, in the same PR.
#
#   date      the merge day, as `git log --date=short` shows the squash commit
#             on main; write it unquoted (YYYY-MM-DD). Without one the row
#             shows 日期未记录 and sorts last; the build date is never used.
#   title     the row's bold line
#   note      one line: what changed
#   page      where the row links: share | product-knowledge | product-matrix |
#             market-policy | deliverables | system | design-system
#             (hidden while that page, or the share package, is not built)
#   anchor    optional lower-case id on that page, such as work-map
#   evidence  pr:<repo>#<n>, or a list of them, for reviewers; never shown
#
# An entry with an unknown page, an empty title or note, or a bad anchor is
# dropped with a Sphinx warning; an unreadable file shows 暂无更新记录。
schema: hello-docs-knowledge-updates/v1


{#- Category icons of the 产品分类 categories (settings.json catalog_categories names the icon per category),
    shared by the 说明书资料库 (manual_portal.html) and 搜索说明书正文 (search.html):
      {% from "_category_icons.html" import category_icon %} -#}
{%- macro category_icon(name, size=18) -%}<svg class="cat-icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == 'portable' -%}<rect x="3" y="7" width="18" height="12" rx="2.4"/><path d="M8 7V5h8v2"/><path d="M12.6 10.5l-2.2 3.3h2.8l-2.2 3.3"/>
{%- elif name == 'home' -%}<path d="M4 10.5L12 4l8 6.5V19a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M12.6 10.5l-2.2 3.4h2.8l-2.2 3.4"/>
{%- elif name == 'battery' -%}<rect x="5" y="4" width="14" height="6" rx="1.6"/><rect x="5" y="12" width="14" height="6" rx="1.6"/><path d="M12 19.5v1.5"/>
{%- elif name == 'solar' -%}<path d="M4 17l2.5-9h11L20 17z"/><path d="M9 8l-1 9M15 8l1 9M5.3 12.5h13.4"/>
{%- elif name == 'accessory' -%}<path d="M9 3v4M15 3v4"/><path d="M7 7h10v4a5 5 0 0 1-10 0z"/><path d="M12 16v5"/>
{%- else -%}<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12h8"/>
{%- endif -%}</svg>{%- endmacro -%}

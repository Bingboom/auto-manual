# The reading frame's own words around a verified manual (manual_reader.html and its feedback card), in the
# manual's language (2026-11). tools/rtd/manual_reader.py reads this file; a manual whose language has no set
# here gets the English one. Every language gives every key that en gives. {n} is the chapter count, always 2
# or more; {address} is the feedback email address. Chapter titles and the manual itself are never translated.
en:
  skip: Skip to the manual
  library: Manual library
  back: Back to the manual library
  version: Version
  search: Search manuals
  contents: Contents
  chapters: "{n} chapters"
  close: Close contents
  top: Back to top
  feedback: Feedback
  feedback_title: Found a problem?
  feedback_text: Copy the feedback details (model, region, language, version and page address) and send them to us.
  feedback_copy: Copy feedback details
  feedback_show: Show feedback details
  feedback_copied: Copied. You can paste it into your email.
  feedback_failed: Couldn't copy automatically. Please select the feedback details below.
  email: Email {address}

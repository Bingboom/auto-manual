<svg viewBox="0 0 420 240" role="img" aria-labelledby="diagram-{{ topic.id|e }}">
<title id="diagram-{{ topic.id|e }}">{{ topic.title|e }}：{{ topic.diagram_caption|e }}</title>
<defs><marker id="arrow-{{ topic.id|e }}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="#687481"/></marker></defs>
{% if topic.id == 'ac-total' %}
<rect class="source" x="105" y="12" width="210" height="52" rx="5"/><text x="210" y="44">共享 AC 输出能力</text>
<path d="M210 64 V100 H100 V125 M210 100 H320 V125" marker-end="url(#arrow-{{ topic.id }})"/>
<path d="M100 100 V125" marker-end="url(#arrow-{{ topic.id }})"/>
<rect x="15" y="130" width="170" height="52" rx="5"/><text x="100" y="162">插座 1 → 负载 P₁</text>
<rect x="235" y="130" width="170" height="52" rx="5"/><text x="320" y="162">其他插座 → P₂…</text>
<text x="210" y="220">P₁ + P₂ + … ≤ AC 合计上限</text>
{% elif topic.id == 'ups' %}
<rect class="source" x="10" y="15" width="160" height="48" rx="5"/><text x="90" y="45">市电 → 旁路</text>
<rect x="10" y="120" width="160" height="48" rx="5"/><text x="90" y="150">电池 → 逆变器</text>
<rect x="225" y="65" width="180" height="60" rx="5"/><text x="315" y="91">供电切换</text><text x="315" y="113">→ AC 负载</text>
<path d="M170 39 H195 V82 H220" marker-end="url(#arrow-{{ topic.id }})"/>
<path d="M170 144 H195 V110 H220" marker-end="url(#arrow-{{ topic.id }})"/>
<text class="diagram-note" x="210" y="215">两条供电路径 · 切换期间可能短暂中断</text>
{% else %}
{% for node in topic.diagram_nodes %}
<rect{% if loop.first %} class="source"{% endif %} x="45" y="{{ 8 + loop.index0 * 80 }}" width="330" height="52" rx="5"/>
<text x="210" y="{{ 40 + loop.index0 * 80 }}">{{ node|e }}</text>
{% if not loop.last %}<path d="M210 {{ 60 + loop.index0 * 80 }} V{{ 83 + loop.index0 * 80 }}" marker-end="url(#arrow-{{ topic.id }})"/>{% endif %}
{% endfor %}
{% endif %}
</svg>

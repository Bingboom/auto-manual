# 设计系统页的文字与取值来源。数值不写在这里：构建时从仓库当前的 web_manual.css
# 读取（见 tools/rtd/design_system.py）。每条 `selector` / `requires` 都必须在样式表中
# 存在，否则单元测试失败，页面不会展示过期的规则。
# 行内格式只有两种：`代码` 与 **加粗**。
schema_version: 1
lead: >-
  说明书网页版的视觉规则：颜色、字体与组件。每次构建都读取仓库当前的网页样式表，
  并用它渲染下面所有数值和预览，所以这里看到的就是线上说明书正在用的规则。

overview:
  - id: identity
    title: 风格
    paragraphs:
      - 一本安静的技术手册：白纸上的暖近黑、一套粗壮的几何无衬线字体、圆角表格外框和深色胶囊标题。没有强调色，强调只靠字重、大小写和品牌深色填充。
      - 同一份来源输出四种格式：响应式**网页**、固定版面的 **PDF**、可编辑的 **IDML** 和 **Word**。34 个 `HB-*` 语义样式 ID 是共同的契约，由各个渲染器分别投影；本页展示的是网页投影。
  - id: content
    title: 内容原则
    items:
      - "**文字只来自来源，不由渲染器编造。** 标题、表头、警示词、按键名、状态词、时长、图注和替代文字，都能追溯到来源文件、来源表或显式配置。缺少标签的组件保持为空或直接失败，绝不自动填入 `WARNING`、文件名或内部类型名。"
      - "**指令清楚、平实。** 用简短的祈使句点明对象，例如 “Restart the product.”。只有动作属于读者时才称呼 *you*，例如保修注册。"
      - "**产品名是变量。** 共享文案里写 `|PRODUCT_NAME|`、`|LEGAL_COMPANY_NAME|`、`|WARRANTY_EMAIL|`，不要把具体型号写死在共享文案里。"
      - "**大小写。** H1、H2 由样式表转成大写，来源保留原有大小写；H3、保修标题和 App 步骤标题保持来源大小写；警示词一律大写；规格标签用词首大写，例如 Cell Chemistry。"
      - "**警示词含义固定。** WARNING 表示可能导致严重伤害、死亡和/或财产损失；CAUTION 表示可能导致人身伤害和/或财产损失；NOTE 表示可能导致设备损坏、数据丢失、性能下降或意外结果；TIP 用于补充正文中的重要信息或操作提示。DANGER 是独立的变体，不是更醒目的 WARNING。各语言使用已登记的译名。"
      - "**状态词** 放在显示屏或指示灯说明的行首（On、Blink、Off），加粗并翻译，绝不只靠颜色表达状态。"
      - "**数字与单位** 之间留一个空格，例如 1024 Wh、0 °C to 45 °C。数量用 ×（2 × AC），尺寸用 x（31.4 x 20.1 x 23.4 cm）；交流写 `~`，直流写 `⎓`，上限以 max. 结尾。规格脚注在标签里用 ①，注释前再以正常字号重复一次。"
      - "**多步骤处理** 逐行编号。来源用 ` / ` 分隔步骤，每一步单独成行。"
      - "**不用表情符号。** 只有警示徽标里的 ⚠，以及数据中的 ⎓、~、×、●、① 这几个字符。"
  - id: foundations
    title: 视觉基础
    items:
      - "**颜色。** 所有内容都放在 `--hb-paper` 白纸上；即使嵌在深色界面里，手册也保持白纸，所以只有一套主题。`--hb-brand-dark` 是唯一的品牌色，用于 H1 深色条、标题圆点、警示徽标、数字和所有强边框。正文与表格文字用 `--hb-text`，次要文字用 `--hb-text-muted`；标签和表头单元格用 `--hb-surface`，数值单元格保持白底。两种细线在白底上的对比都不到 3:1，所以细线从不单独表达含义。状态灯颜色只出现在指示灯说明里，并且始终配文字。"
      - "**字体。** 只有一套字体：Gilroy 是商业授权字体，不随网站分发；读者电脑上没有时，依次回退到 Avenir Next、Avenir、Segoe UI、Helvetica、Arial。网页正文用 400，表格标签和表头用 600，标题、徽标和标签用 700。多数网页字号是随视口变化的 `clamp()` 区间，具体见“字体”分页。"
      - "**版式。** 居中单栏，宽度为 `--hb-reading-width`，连续正文不超过 `--hb-copy-width`。所有通栏组件（H1 深色条、表格外框、组合组件）共用一条外宽契约：`box-sizing: border-box; width: 100%; max-width: var(--hb-component-band-max)`，新增通栏组件也必须加入这条规则。共用断点是 760px（字号收缩、双栏变单栏）、520px（警示框的标签和正文上下排列）以及打印。宽表格保留最小宽度并在外框内部横向滚动，不压缩、不断词。网页不分页，页码和页脚只属于印刷版。"
      - "**形状。** 外框分两类：规格、故障排除、警示词、符号、对比、按键组合和显示屏模式表格用品牌深色外框；警示框、装箱卡片和保修卡用柔和细线外框；FCC 面板只有浅灰填充。外框内最后一行不画下边线、最后一列不画右边线，外侧只由外框画出。H1 深色条上边切平、下边两角为圆角（`--hb-h1-radius`）；胶囊是全圆角，数字放在圆形里。"
      - "**层次与动效。** 只有一层阴影：`--hb-shadow` 把纸面从页面上托起，760px 以下和打印时去掉。纸面内部全部是平的，靠线和填充区分，从不用阴影。没有动效。"
      - "**状态。** 说明书是用来阅读的，不是操作界面。链接是品牌深色，下划线用 `--hb-line`。语言切换是原生下拉框，保留浏览器自带的焦点框。"
      - "**图像。** 产品图按机型提供，从不重画。首选“无字底图 + 实时网页文字”：标签、胶囊和步骤都是网页文字，可搜索、可翻译。已批准的成品面板整块使用，并保留它自带的边框。先复用现有素材再提取新素材；保留完整面板和 App 截图的手机外框；不要在非白色背景上盖白框。"
  - id: usage
    title: 使用方式
    items:
      - "只加载由 `tools/web/stylesheets.py` 按顺序拼装的 `web_manual.css`；样式里引用 `var(--hb-*)`，不要把数值抄进去。"
      - "手册内容放在 `#furo-main-content` 容器里。章节内直接写 `h1`、`h2`、`h3`、`p`、`ul`、`ol`、`blockquote`，由容器的作用域统一排版。"
      - "组件只照抄“组件”分页里的结构，不要自造类名：没有登记的 `hb-*` 类不会有任何样式。"
      - "新增内容时保持外宽契约、760px 与 520px 两个断点的行为，以及“宽内容在外框内滚动”的规则。"

colors:
  - name: 品牌深色
    token: "--hb-brand-dark"
    note: 唯一的品牌色：H1 深色条、H2/H3 圆点、警示徽标、装箱编号、保修标题标签与年份圆、“另售”胶囊；规格、故障排除、符号、对比和显示屏模式表格的外框与内线；链接文字。上面放白字。印刷对应 BrandDark（CMYK 0 0 0 90）。
  - name: 正文
    token: "--hb-text"
    note: 正文、表格和标题文字。可以放在白纸、浅灰面、加深浅灰面和前提说明底色上。印刷对应 TextK90。
  - name: 次要文字
    token: "--hb-text-muted"
    note: 斜体强调、规格注释与脚注、参考图图注、标题锚点链接、产品概览的引线。
  - name: 结构细线
    token: "--hb-line"
    note: 图示区、参考表格、显示屏图标表的外框与网格、引用块竖线、链接下划线。对比度不到 3:1，源样式就是如此，所以从不单独表达含义。印刷对应 LineK40。
  - name: 柔和细线
    token: "--hb-line-soft"
    note: 网页纸面边框，警示框、装箱卡片和保修卡的外框，显示屏模式组合的外框。纯装饰；需要被看清的外框改用品牌深色。
  - name: 纸面
    token: "--hb-paper"
    note: 说明书唯一的底色：纸面、表格数值单元格、警示框标签格、卡片。也是品牌深色填充上的文字颜色。
  - name: 浅灰面
    token: "--hb-surface"
    note: 标签与表头单元格（规格标签、故障代码、显示屏编号与名称、对比表左列、符号图标列）、警示框正文、FCC 面板、保修引言，以及手机版操作卡片。印刷对应 BgK05。
  - name: 加深浅灰面
    token: "--hb-surface-strong"
    note: 浅灰标签的警示框变体、状态表表头、来源的安全标题和电源面板。
  - name: 前提说明底色
    selector: ".hb-base-art-live-copy"
    property: "--hb-prerequisite-surface"
    note: 叠在无字操作底图上的浅灰前提说明胶囊。
  - name: 状态灯 · 绿
    selector: "#furo-main-content :is(.hb-lamp-green, .hb-lamp-red, .hb-lamp-blinking, .hb-lamp-off)::before"
    property: background
    note: “亮”和“闪烁”行的指示灯色块。色块旁边始终写状态词，颜色从不单独表达状态。
  - name: 状态灯 · 闪烁光晕
    selector: "#furo-main-content .hb-lamp-blinking::before"
    property: box-shadow
    note: 绿色色块外的一圈光晕，用来标示“闪烁”。
  - name: 状态词 · 绿
    selector: "#furo-main-content :is(.hb-lamp-green, .hb-lamp-blinking)"
    property: color
    note: “亮”和“闪烁”行的状态词文字，只放在白色单元格上。
  - name: 状态灯 · 红
    selector: "#furo-main-content .hb-lamp-red::before"
    property: background
    note: 红灯色块，也是它的状态词颜色。作为文字时对比度略低于正文要求，所以一定保留色块并写出状态词。
  - name: 熄灭灯外框
    selector: "#furo-main-content .hb-lamp-off::before"
    property: border
    note: 白色“熄灭”色块的外框；状态由 Off 这个词表达。

type_styles:
  - name: web-title-l1
    label: 一级标题 · HB-TITLE-L1
    selector: "#furo-main-content h1"
    sample: Safety Instructions
    note: 深色条内的白字，由样式表转成大写。
  - name: web-title-l2
    label: 二级标题 · HB-TITLE-L2
    selector: "#furo-main-content h2:not(.hb-spec-section)"
    sample: Charging the Product
    note: 品牌深色圆点之后，大写。
  - name: web-title-l3
    label: 三级标题 · HB-TITLE-L3
    selector: "#furo-main-content h3"
    sample: Charging via AC Wall Outlet
    note: 小圆点之后，保持来源大小写，不随视口缩放。
  - name: web-body
    label: 正文 · HB-TYPE-BODY
    selector: "#furo-main-content"
    sample: Store the product in a dry, clean place with proper ventilation.
    note: 纸面内的连续正文与列表。
  - name: web-spec
    label: 规格表
    selector: "#furo-main-content table.hb-spec-table"
    sample: Cell Chemistry · LiFePO4
    note: 标签格 600、白底数值格 400，圆圈注号缩小显示。
  - name: web-note
    label: 规格注释
    selector: "#furo-main-content .manual-spec-note"
    sample: "① Tested at 25 °C."
    note: 次要文字颜色。
  - name: web-callout-label
    label: 警示框标签
    selector: "#furo-main-content .manual-callout-label"
    sample: NOTE
    note: 白色标签格里的警示词，大写、不换行；字号继承正文。
  - name: web-signal-badge
    label: 警示词徽标
    selector: "#furo-main-content .hb-signal-badge"
    sample: WARNING
    note: 品牌深色底上的白字；WARNING、CAUTION 和 DANGER 前有 ⚠。
  - name: web-trouble-code
    label: 故障代码
    selector: "#furo-main-content table.hb-troubleshooting-table .hb-troubleshooting-code"
    sample: F4
    note: 故障排除表代码列内居中，浅灰底。
  - name: web-inbox-label
    label: 装箱卡片名称
    selector: ".hb-inbox-label"
    sample: AC Charging Cable
    note: 装箱卡片里的物品名称。
  - name: web-figure-label
    label: 图内实时标签
    selector: ".hb-figure-callout"
    sample: AC Output Ports
    note: 产品概览等图上的网页文字标签，首行加粗。
  - name: web-caption
    label: 参考图图注
    selector: ".hb-reference-caption-grid"
    sample: Front view
    note: 图下居中，次要文字颜色。
  - name: web-warranty-title
    label: 保修卡标题
    selector: "#furo-main-content section:has(> figure.hb-warranty-card) > h2:first-child"
    sample: Limited Warranty
    note: 压在保修卡上边框的深色标签，保持来源大小写，不加圆点。
  - name: web-warranty-numeral
    label: 保修年限数字
    selector: ".hb-warranty-year-badge"
    sample: "3"
    note: 品牌深色圆里的白色数字。
  - name: web-warranty-unit
    label: 保修年限单位
    selector: ".hb-warranty-years-unit"
    sample: YEARS
    note: 数字旁边的单位，大写。

component_groups:
  - id: titles
    title: 标题
  - id: text
    title: 正文与页面
  - id: notices
    title: 警示
  - id: tables
    title: 表格
  - id: features
    title: 专题组件
  - id: warranty
    title: 保修

components:
  - id: title-l1
    group: titles
    title: 一级标题深色条
    style_id: HB-TITLE-L1
    requires: ["#furo-main-content h1"]
    height: 150
    summary: 每页唯一的页标题：通栏品牌深色条，上边切平、下边两角圆，白字大写。
    use: 作为每个说明书页面唯一的顶级标题，同时用于导航。来源保持原有大小写，由样式表转成大写。
    provide: 来源中的本地化标题文字，别的都不需要。
    avoid: 一页放两个 H1；给目录标题加深色条（目录标题是深色文字、没有底条）；在 FCC 面板上方显示深色条（那个 H1 只保留给导航和读屏，视觉上隐藏）。
  - id: title-l2
    group: titles
    title: 二级标题
    style_id: HB-TITLE-L2
    requires: ["#furo-main-content h2:not(.hb-spec-section)"]
    height: 200
    summary: 章节标题：品牌深色圆点 + 粗体大写文字。是圆点标题，不是填充底条。
    use: 用于每个二级章节：Markdown 写 `## 标题`，RST 用 `-----` 下划线，生成页面用 `<h2 class="hb-subbar">`。
    provide: 来源标题；大写和圆点都由样式表处理。
  - id: title-l3
    group: titles
    title: 三级标题
    style_id: HB-TITLE-L3
    requires: ["#furo-main-content h3"]
    height: 150
    summary: 小节标题：小圆点 + 保持来源大小写的粗体文字。
    use: 用于三级标题（Markdown `### 标题`，RST `~~~~~`）。只有 H1 到 H3 有锚点，不要再往下嵌套。
  - id: sold-separately
    group: titles
    title: “另售”胶囊
    style_id: 标题中的配件说明
    requires: [".hb-sold-separately"]
    height: 170
    summary: 标题里的可选购说明：品牌深色全圆角胶囊配白字，和标题文字分开，两者都可以导航。
    use: 来源在标题里标注配件“另售”时使用；胶囊文字是来源原文（已本地化），从不自动生成。
    avoid: 来源分开写时把“另售”合进标题文字；给胶囊换颜色。
  - id: body-text
    group: text
    title: 正文
    style_id: HB-TYPE-BODY · HB-TYPE-LIST
    requires: ["#furo-main-content"]
    height: 400
    summary: 连续正文：段落、列表与引用，限制在正文宽度内。
    use: 所有普通段落、列表和引用都直接写 `p`、`ul`、`ol`、`blockquote`、`strong`、`em`、`a`、`sub`，由容器统一排版。
  - id: sheet
    group: text
    title: 网页纸面
    style_id: 页面容器
    requires: ["#furo-main-content"]
    stage: sheet
    height: 420
    summary: 网页页面容器：一张与阅读栏同宽的白色纸面，柔和细线边框、小圆角，以及整个系统唯一的阴影。
    use: 每页一个，放在承载各章节的元素上。
    avoid: 纸面套纸面、给纸面上色、在纸面内部加阴影。
  - id: locale-picker
    group: text
    title: 语言下拉框
    style_id: 手册中心语言切换
    requires: [".manual-locale-nav"]
    stylesheets: [manual-locales.css]
    height: 120
    summary: 已发布单语说明书页的语言切换：左侧是型号和市场版本，右侧是原生语言下拉框，放在细边框圆角条里。
    use: 只出现在手册中心，由门户自动加在每个已验证的单语说明书页面顶部；说明书来源里从不写它。没有已验证单语信息的旧页面不加，保持原样。
    provide: 不需要手工提供：门户根据冻结发布记录生成。已验证的语言可以切换，其余语言保留在列表里但不可选，并注明原因。预览使用仓库测试数据中的 JE-TEST · EUUK。
    avoid: 写进说明书来源或印刷版；切换语言时带上当前章节锚点。
  - id: callout
    group: notices
    title: 警示框
    style_id: HB-CALLOUT-STRIP
    requires: [".manual-callout-table"]
    height: 440
    summary: 警示条：白色标签格里放警示词，旁边是浅灰正文，外面是柔和细线外框。
    use: 正文中所有 WARNING、CAUTION、NOTE、TIP 和 DANGER 都用它。Markdown 写带标签的 `{callout}` 块；RST 中无表头、一行两格、首格是已登记警示词的列表表格会自动变成警示框。
    provide: 本地化的警示词（必填，缺失时直接失败，从不默认成 WARNING）和正文。渲染器会给同一页的标签格对齐宽度。
    avoid: 按严重程度给警示框换颜色（风险由警示词表达）；警示框套警示框；用样式表翻译标签。
  - id: safety-notice
    group: notices
    title: 安全说明
    style_id: HB-SAFETY-INSTRUCTION · HB-SAFETY-LEAD
    requires: [".hb-safety-instruction"]
    height: 520
    summary: 安全说明页专用：紧凑的说明横幅、基于警示词表的警告引导面板，以及深色胶囊小标题下的双栏安全条款。
    use: 只用于来源明确标出的安全章节；普通 Markdown 无法生成这些样式。
    provide: 来源原文和标记图形：横幅用深色警示三角，引导面板深色格里用白色警示三角，或使用符号库里的符号。
    avoid: 把 DANGER 做成 WARNING 的样子；改写锁定图里的文字。
  - id: spec-table
    group: tables
    title: 规格表
    style_id: HB-TABLE-SPEC
    requires: [".hb-spec-table-composition"]
    height: 470
    summary: 纵向规格表：浅灰标签列 + 白底数值列，品牌深色外框，每个规格分组一张表，放在普通二级标题下。
    use: 所有规格章节。Markdown 用 `{spec-table} 分组名` 块，按 `标签 | 数值` 写行，标签留空表示并入上一行。
    provide: 本地化的分组标题和规格行（标签组、一个或多个数值、圆圈注号）。数值来自规格来源表，不在模板里手写。
    avoid: 只改某一种输出的标签列比例；网页、PDF、Word、IDML 的比例是分别批准的。
  - id: troubleshooting-table
    group: tables
    title: 故障排除表
    style_id: HB-TABLE-TROUBLESHOOTING
    requires: [".hb-troubleshooting-composition"]
    height: 390
    summary: 故障代码表：浅灰代码列里是大号粗体代码，旁边是处理办法，品牌深色外框。
    use: 用于故障排除页：一行表头加 F0 到 FE 的代码。Markdown 用 `{troubleshooting}` 块。
    provide: 两个本地化表头和来自故障排除来源表的行。多步骤处理用 ` / ` 分隔，每步单独成行。
    avoid: 让来源里的 `|` 作为文字进入单元格；在代码或处理办法里断词。
  - id: signal-word-table
    group: tables
    title: 警示词说明表
    style_id: HB-TABLE-SYMBOL-SIGNAL
    requires: [".hb-symbol-signal-composition"]
    height: 350
    summary: 警示词图例：深色矩形徽标配每个警示词的固定含义，品牌深色外框。
    use: 在符号页用一次，定义 WARNING、CAUTION、NOTE、TIP（来源列出时还有 DANGER）。只能由流水线从符号来源表生成。
    provide: 两个本地化表头，以及每行的本地化警示词和含义。⚠ 由渲染器为 WARNING、CAUTION 和 DANGER 添加。
  - id: symbol-pair-table
    group: tables
    title: 符号说明表
    style_id: HB-TABLE-SYMBOL-ICON
    requires: [".hb-symbol-pair-composition"]
    height: 420
    summary: 左右两块独立的符号面板：浅灰图标列 + 白底含义列，各自有品牌深色外框。
    use: 符号页图例；Markdown 用 `{symbols}` 块。来源的四列拆成左右两块，没有图标的行会去掉，两块的行高互不影响。
    provide: 本地化表头、含义，以及按语义键和变体从共享符号库选取的符号。
  - id: lcd-icon-table
    group: tables
    title: 显示屏图标表
    style_id: HB-TABLE-LCD-ICON
    requires: [".hb-lcd-table-composition"]
    height: 520
    summary: 显示屏图例：圆圈编号、屏幕图标、名称和状态说明四列，是唯一用浅色外框的数据表。
    use: 所有显示屏图标图例；Markdown 用 `{lcd-icons}` 块。还有不带编号、只有文字两种变体。
    provide: 编号、图标、本地化名称和说明。状态说明以加粗、已翻译的状态词开头（On / Blink / Off）。
  - id: lcd-mode-table
    group: tables
    title: 显示屏模式表
    style_id: HB-TABLE-LCD-MODE
    requires: [".hb-lcd-mode-composition"]
    height: 470
    summary: 显示屏模式组合：设备图旁边是“状态 / 操作 / 说明”矩阵，外层柔和细线外框，矩阵有自己的品牌深色外框。
    use: 用于显示屏模式说明；Markdown 用 `{lcd-mode}` 块加一张图。每个状态跨越它的所有操作，没有表头行。
    provide: 设备图（按机型提供，预览里是占位）和本地化的状态、操作、说明。
  - id: comparison-table
    group: tables
    title: 对比表
    style_id: HB-TABLE-AUTO-RESUME
    requires: [".hb-auto-resume-composition"]
    height: 300
    summary: 两列对比：左列浅灰、右列白底，粗体表头，品牌深色外框。
    use: 成对的条件列表，例如“会自动恢复 / 不会自动恢复”；Markdown 用 `{comparison} 左表头 | 右表头` 块。
    provide: 两个本地化表头和条件行。
  - id: key-combination-table
    group: tables
    title: 按键组合表
    style_id: HB-TABLE-KEY-COMBINATIONS
    requires: [".hb-key-combination-composition"]
    height: 420
    summary: 组合按键表：按键图配网页文字说明、带时钟的按住时长，以及对应功能，品牌深色外框。
    use: 多键组合快捷操作，只能由流水线生成。
    provide: 按键图（选与产品丝印一致的变体）、本地化按键说明（丝印文字加粗）、时长和功能文字。“+”是网页文字，时长前的时钟由样式表绘制。
  - id: reference-table
    group: tables
    title: 参考表
    style_id: HB-TABLE-REFERENCE
    requires: [".hb-reference-composition"]
    height: 280
    summary: 来源明确声明的纯文字参考表：完整的单元格细线，细线外框，有表头时表头为品牌深色。
    use: 来源把文字表标为参考表时使用；不同变体设定不同的列宽。
    provide: 原样的来源单元格，表头也是来源原文。
  - id: status-lamp-table
    group: tables
    title: 指示灯状态表
    style_id: 来源状态表
    requires: [".hb-source-operation"]
    height: 420
    summary: 指示灯状态表：每种颜色是颜色词前的小色块，行与行之间上下有灰线。
    use: 来源说明 LED 指示灯状态时使用，由来源编写：颜色词使用 `:hb-lamp-green:`、`:hb-lamp-red:`、`:hb-lamp-blinking:`、`:hb-lamp-off:` 角色。
    provide: 所有文字：状态、颜色名、产品状态和备注。色块从不代替文字。
    avoid: 在别处使用状态灯颜色；只用颜色表示状态。
  - id: fcc-panel
    group: features
    title: FCC 声明
    style_id: HB-SPECIAL-FCC
    requires: [".hb-fcc-composition"]
    height: 520
    summary: FCC 声明：无边框的浅灰面板，FCC 标志在开头文字旁，条款分两栏排列。
    use: 用于 FCC 页面，只能由流水线生成。页面的 FCC 标题保留给导航和读屏，视觉上隐藏，不显示深色条。
    provide: "无障碍标签、开头文字、按顺序排列的正文块（NOTE:、MODIFICATION: 等标签加粗）、分栏位置和 FCC 标志。来源没有的内容一律不添加。"
  - id: inbox-cards
    group: features
    title: 装箱清单
    style_id: HB-SPECIAL-INBOX
    requires: [".hb-inbox-composition"]
    height: 520
    summary: 包装内容：带品牌深色编号圆的白色高卡片、物品图和粗体名称，下方是通栏 TIP 条。
    use: 用于包装内容页，只能由流水线生成。正好三张卡片时等宽三列（打印只支持这种）；其他数量自动排成卡片网格。
    provide: 来源的标题、按顺序的卡片（图、本地化名称和替代文字），以及相邻的 TIP 或 NOTE。编号由样式表生成；缺卡片或缺 TIP 标签会直接失败。
  - id: package-panel
    group: features
    title: 包装分组
    style_id: 来源包装分组
    requires: [".hb-package-panel"]
    height: 480
    summary: 分组的包装内容：物品放在圆角细线面板里，可选组用虚线框，并以带购物车图形的灰色“另售”胶囊结尾。
    use: 来源分组列出“随附”和“另售”物品时使用；和三卡片的装箱清单是两回事。
    provide: 不含文字的物品图、本地化名称和可选购说明。面板外框和胶囊由样式表绘制，不画进图里。
  - id: overview-figure
    group: features
    title: 产品概览图
    style_id: HB-SPECIAL-OVERVIEW
    requires: [".hb-annotated-figure"]
    height: 560
    summary: 带标注的产品图：产品图上按百分比放置网页文字标签，用细引线连到图上。
    use: 产品概览，只能由流水线生成。位置来自该机型与市场的版本化实例登记，从不估算；有已批准的成品面板时整块替换。
    provide: 视图图片（按机型提供，预览里是占位）、宽高比，以及每个标注的编号、标签、位置和对齐方式。预览中的标注位置仅作示意，标签文字是真实来源原文。
  - id: operation-figure
    group: features
    title: 操作图
    style_id: HB-SPECIAL-OPERATION
    requires: [".hb-operation-figure"]
    height: 520
    summary: 操作面板：无字设备底图上，在登记的位置叠放可翻译的步骤、时长和前提说明，配套说明放在旁边或下方。
    use: 按键和接口操作，只能由流水线生成。首选“底图 + 实时文字”：底图只有图形、括号和引线，所有字都是网页文字。
    provide: 操作编号、无字底图（按机型提供，预览里是占位）及其锚点、本地化的步骤、说明、前提和配套文字。
    avoid: 把文字画进底图；来源把前提画在图上时把它移出图外。
  - id: reference-figure
    group: features
    title: 参考图
    style_id: HB-SPECIAL-REFERENCE-FIGURE
    requires: [".hb-reference-figure"]
    height: 470
    summary: 保留实时文字的参考插图：圆角面板里是无字底图，来源的标签、胶囊和尺寸标记以网页文字叠放在图上。
    use: 安装、摆放、充电和线缆示意图，只能由流水线生成；图注在图下方时改用图注网格。
    provide: 底图（按机型提供，预览里是占位）、登记的哈希，以及每行来源文字的位置；来源画了填充框时才加胶囊底色。
    avoid: 裁出来源边框之外；在非白背景上盖白色；把产品丝印改成网页文字。
  - id: app-download
    group: features
    title: App 下载
    style_id: HB-SPECIAL-APP
    requires: [".hb-app-download-composition"]
    height: 400
    summary: App 下载区块：应用商店徽标和二维码并排，各自下方一行说明，上面是带编号的步骤标题。
    use: App 设置相关章节。包含 App 组合的章节里，H2、H3 不加圆点也不大写，App 步骤按来源大小写编号。
    provide: 已批准的商店徽标和来源二维码（按机型提供，预览里是占位）、两段说明文字，以及给读屏用的描述。缺徽标或缺列会直接失败，不会只剩二维码。
  - id: warranty-lead
    group: warranty
    title: 保修引言
    style_id: HB-WARRANTY-LEAD
    requires: [".hb-warranty-intro-composition"]
    height: 230
    summary: 保修开头：适用范围声明放在浅灰面板里，下面是当地法规说明。
    use: 紧跟在保修 H1 之后。除最后一段外的引言段落都放进面板，最后一段作为说明。
  - id: warranty-section
    group: warranty
    title: 保修条款卡
    style_id: HB-WARRANTY-SECTION
    requires: [".hb-warranty-card"]
    height: 330
    summary: 保修条款卡：柔和细线外框的白卡片，标题做成压在上边框的深色标签。
    use: 每条保修条款一张。嵌套结构很关键：卡片必须是所在章节的直接子元素，H2 是该章节的第一个子元素，样式表才会把标题提到卡片上。
    provide: 本地化的条款标题和正文（段落、列表或分行文字），以及从 1 开始的条款序号。
  - id: warranty-years
    group: warranty
    title: 保修年限卡
    style_id: HB-WARRANTY-YEARS
    requires: [".hb-warranty-period-card"]
    height: 330
    summary: 保修期卡片：每种保修期是一个品牌深色圆里的大号数字，旁边是单位和保修名称，下面是说明，桌面版两栏并排。
    use: 用于保修期条款。数字、单位和名称从每格第一段粗体文字解析（如 “3 YEARS”），来源必须保持这个格式，否则直接失败。

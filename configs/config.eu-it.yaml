extends: config-bases/eu-single-language-base.yaml

build:
  family_id: eu-it
  languages: [it]
  targets:
    - model: JE-1000F
      region: EU
    - model: JE-1000H
      region: EU
    - model: JE-2000F
      region: EU
    - model: JE-2000E
      region: EU
    - model: JE-3000C
      region: EU
  word_title: "|PRODUCT_NAME| Manuale utente"

paths:
  page_manifest: docs/manifests/manual_eu-single-it.yaml
  web_illustration_manifests:
    JE-1000H_EU: docs/renderers/web/je1000h_eu_it_illustrations.json
    JE-2000F_EU: docs/renderers/web/je2000f_eu_it_illustrations.json
checks:
  allowed_foreign_identity_literals:
    - 占位符
    - Jackery Battery Pack 2000
    - Jackery Battery Pack 3600

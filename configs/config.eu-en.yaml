extends: config-bases/eu-single-language-base.yaml

build:
  family_id: eu-en
  languages: [en]
  targets:
    - model: JE-1000F
      region: EU
    - model: JE-1000H
      region: EU
    - model: JE-2000F
      region: EU
    - model: JE-2000E
      region: EU
    - model: JE-100C
      region: EU
    - model: JE-500A
      region: EU
    - model: JE-3000C
      region: EU
    - model: JE-3600A
      region: EU
  word_reference_doc: docs/templates/word_template/reference_en.docx
  word_title: "|PRODUCT_NAME| User Manual"
  rst_substitutions:
    MANUAL_LANGUAGE_SCOPE: English / French / Spanish / German / Italian

paths:
  page_manifest: docs/manifests/manual_eu-en.yaml
  page_manifests:
    JE-100C_EU: docs/manifests/manual_je100c_eu-en.yaml
    JE-500A_EU: docs/manifests/manual_je500a_eu-en.yaml
  web_illustration_manifests:
    JE-1000H_EU: docs/renderers/web/je1000h_eu_en_illustrations.json
    JE-2000F_EU: docs/renderers/web/je2000f_eu_en_illustrations.json
    JE-2000E_EU: docs/renderers/web/je2000e_eu_en_illustrations.json
    JE-100C_EU: docs/renderers/web/je100c_eu_en_illustrations.json
    JE-500A_EU: docs/renderers/web/je500a_eu_en_illustrations.json
    JE-3000C_EU: docs/renderers/web/je3000c_eu_en_illustrations.json
    JE-3600A_EU: docs/renderers/web/je3600a_eu_en_illustrations.json

checks:
  # This list replaces the base list. Battery Pack 3600 is verified compatible
  # accessory copy on the JE-3600A connection page, not the manual identity.
  allowed_foreign_identity_literals:
    - 占位符
    - Jackery Battery Pack 2000
    - Jackery Battery Pack 3600

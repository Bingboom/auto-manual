# Portable solar-panel family, EU English Web target.
extends: config-bases/eu-single-language-base.yaml

build:
  family_id: solar-eu-en
  language_family: eu-en
  skeleton_family: SOLAR
  languages: [en]
  default_model: JS-100I
  default_region: EU
  targets:
    - model: JS-100I
      region: EU
    - model: JS-40C
      region: EU
    - model: JS-100F
      region: EU
  include_lang_in_output_path: true
  build_word: false
  build_html: false
  word_title: "|PRODUCT_NAME| User Manual"
  web_entry_source_patterns:
    - "01_safety_tips*"
    - "safety_tips*"
    - "spec*"
  rst_substitutions:
    WARRANTY_EMAIL: hello.eu@jackery.com
    LEGAL_COMPANY_NAME: Jackery

paths:
  page_manifest: docs/manifests/manual_solar-eu-en.yaml
  page_manifests:
    JS-40C_EU: docs/manifests/manual_solar-eu-en-JS-40C.yaml
    JS-100F_EU: docs/manifests/manual_solar-eu-en-JS-100F.yaml
  web_illustration_manifests:
    JS-40C_EU: docs/renderers/web/js40c_eu_en_illustrations.json
    JS-100I_EU: docs/renderers/web/js100i_eu_en_illustrations.json
    JS-100F_EU: docs/renderers/web/js100f_eu_en_illustrations.json

checks:
  allowed_foreign_identity_literals:
    - Jackery portable power station

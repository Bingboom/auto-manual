extends: config-bases/eu-single-language-base.yaml

build:
  family_id: eu-de
  languages: [de]
  targets:
    - model: JE-1000F
      region: EU
    - model: JE-2000F
      region: EU
    - model: JE-2000E
      region: EU
    - model: JE-3000C
      region: EU
  word_title: "|PRODUCT_NAME| Benutzerhandbuch"

paths:
  page_manifest: docs/manifests/manual_eu-single-de.yaml
  web_illustration_manifests:
    JE-2000F_EU: docs/renderers/web/je2000f_eu_de_illustrations.json
checks:
  allowed_foreign_identity_literals:
    - 占位符
    - Jackery Battery Pack 2000
    - Jackery Battery Pack 3600

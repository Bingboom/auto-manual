# BP (battery pack) family, US region — skeleton-library slice S1 target.
# Every entrypoint may infer this config from Document_Key=JBP-2000B_US only
# after the exact target below matches. The queue row keeps the shared US
# trilingual language family; family_id + skeleton_family select the BP page
# contract without leaking product type into Build_family.
extends: config-bases/phase2-sync-base.yaml

doc_type: manual_bundle

build:
  family_id: bp-us
  language_family: us-merged
  queue_requires_target_match: true
  # Mirrors docs/manifests/skeletons/bp-intl/blueprint.yaml `skeleton_family`.
  # Selects the contract `category:` tier, so BP skips the host-only
  # placeholder groups without forking any contract. Absent = MAIN.
  skeleton_family: BP
  languages: [ en, fr, es ]
  include_lang_in_output_path: false
  queue_by_document_key: true
  default_model: JBP-2000B
  default_region: US
  targets:
    - model: JBP-2000B
      region: US
  main_tex: manual_demo.tex
  output_pdf: manual_{model_slug}_{region_slug}.pdf
  xelatex_runs: 3
  open_pdf: false
  build_word: true
  word_output: manual_{model_slug}_{region_slug}.docx
  word_source: bundle
  word_reference_doc: docs/templates/word_template/reference_en.docx
  word_title: "|PRODUCT_NAME| User Manual"
  rst_substitutions:
    MANUAL_LANGUAGE_SCOPE: English / French / Spanish
    WARRANTY_EMAIL: hello@jackery.com
    LEGAL_COMPANY_NAME: Jackery Inc.
  open_word: false
  build_html: false
  open_html: false

paths:
  docs_dir: docs
  structured_data_dir: data/phase2
  layout_params_csv: data/layout_params.csv
  page_registry_csv: data/phase2/page_registry.csv
  page_blocks_dir: data/phase2
  spec_master_csv: data/phase2/Spec_Master.csv
  spec_footnotes_csv: data/phase2/Spec_Footnotes.csv
  spec_notes_csv: data/phase2/Spec_Notes.csv
  spec_titles_csv: data/phase2/spec_titles.csv
  page_manifest: docs/manifests/manual_bp-us.yaml

tools:
  patch_fonts: tools/patch_latex_fonts.py

# The mirror image of the allowlist in config-bases/phase2-sync-base.yaml.
# There, host manuals are allowed to name the battery pack as their expansion
# accessory; here, the battery pack's own manual has to name its host — every
# charging, connections and operation instruction in the shipped book routes
# through the HomePower 2000 Plus, which is JE-2000E's registered product_name.
#
# NOTE: this list REPLACES the base's rather than extending it (config_loader
# deep-merges mappings but assigns lists wholesale), so the accessory literal
# from the base is repeated here.
checks:
  allowed_foreign_identity_literals:
    - Jackery Battery Pack 2000
    - Jackery HomePower 2000 Plus

extends: config-bases/eu-single-language-base.yaml

build:
  family_id: eu-fr
  languages: [fr]
  # The base declares only JE-1000F; config_loader assigns lists wholesale,
  # so the inherited target has to be repeated here.
  targets:
    - model: JE-1000F
      region: EU
    - model: JE-1000H
      region: EU
    - model: JE-2000F
      region: EU
    - model: JE-2000E
      region: EU
    - model: JE-3600A
      region: EU
    - model: JE-3000C
      region: EU
  word_title: "|PRODUCT_NAME| Manuel d'utilisation"

paths:
  page_manifest: docs/manifests/manual_eu-single-fr.yaml
  web_illustration_manifests:
    JE-1000H_EU: docs/renderers/web/je1000h_eu_fr_illustrations.json
    JE-2000F_EU: docs/renderers/web/je2000f_eu_fr_illustrations.json
    JE-3000C_EU: docs/renderers/web/je3000c_eu_fr_illustrations.json
checks:
  # JE-3600A 的加电包扩容页按设计引用配套电池包型号名；与 config.eu-en.yaml 同列。
  allowed_foreign_identity_literals:
    - 占位符
    - Jackery Battery Pack 2000
    - Jackery Battery Pack 3600

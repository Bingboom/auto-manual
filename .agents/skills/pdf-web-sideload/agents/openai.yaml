interface:
  display_name: "PDF Web Sideload"
  short_description: "Bypass intake for a book that must go live before structured intake is done: PyMuPDF-extract the shipped PDF, arrange it as a MyST md/ bundle, land it with build.py web-sideload (mandatory debt entry, no pipeline evidence), then collect it with build.py web-assemble like any other book"
  default_prompt: "Use $pdf-web-sideload to land a book that has no structured intake yet but must ship now: extract the shipped PDF with PyMuPDF (never pdftotext), arrange a MyST md/ bundle named to the config's output template, run build.py web-sideload --md-dir <bundle> (dry-run first), then build.py web-assemble to collect it. Confirm the target's model/region/lang is already declared in a family config before starting."

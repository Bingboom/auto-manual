interface:
  display_name: "Asset Textless Extraction"
  short_description: "Extract 无字化 illustration assets from a master: operator decision tree, scratchpad tuning, 12x verification, PIL confirmation, three-place hash sync"
  default_prompt: "Use $asset-textless-extraction to check existing target and shared assets first and record the reuse decision. Reuse matching files unchanged. Only extract when the recorded evidence requires it. Classify the artwork before editing: small LCD/status/button icons use transparency; a full diagram remains a full diagram even when displayed small; complete panels keep gray backgrounds and structural frames; independent empty text boxes, capsules and bubbles are forbidden in base art and must be drawn with shared CSS; inspect bare art before labels and mark obsolete assets do-not-reuse; App screenshots keep all phone edges and status bars. Verify source boundaries at 12x and desktop/mobile layout. Before registry writes, obtain the skill's pixel confirmation and follow its hash-sync procedure."

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Auto-Manual target component architecture</title>
  <desc id="desc">Governed sources become Manual IR and a shared ComponentSpec, with layout policy supplied by PagePlan and format-specific Web, LaTeX, IDML, and Word adapters.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17243A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#12A594"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6557E8"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { font-size: 48px; font-weight: 800; fill: #18263A; letter-spacing: -0.8px; }
      .subtitle { font-size: 20px; font-weight: 500; fill: #617086; }
      .lane { font-size: 15px; font-weight: 700; letter-spacing: 1.4px; }
      .node-title { font-size: 24px; font-weight: 750; fill: #FFFFFF; }
      .node-sub { font-size: 15px; font-weight: 500; fill: #FFFFFF; opacity: 0.9; }
      .card-title { font-size: 20px; font-weight: 750; fill: #26364C; }
      .card-sub { font-size: 14px; font-weight: 500; fill: #607086; }
      .adapter-title { font-size: 20px; font-weight: 750; fill: #FFFFFF; }
      .adapter-sub { font-size: 14px; font-weight: 500; fill: #FFFFFF; opacity: 0.9; }
      .chip { font-size: 12px; font-weight: 700; fill: #4A3CC8; }
      .callout-title { font-size: 16px; font-weight: 750; fill: #18263A; }
      .callout-sub { font-size: 14px; font-weight: 500; fill: #607086; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="28" fill="#FAFBFD"/>
  <circle cx="1450" cy="50" r="190" fill="#E8E5FF" opacity="0.55"/>
  <circle cx="1530" cy="-35" r="112" fill="#CFF4ED" opacity="0.75"/>
  <circle cx="65" cy="850" r="190" fill="#DDF6F1" opacity="0.58"/>

  <text x="800" y="74" class="title" text-anchor="middle">Target Component Architecture</text>
  <text x="800" y="109" class="subtitle" text-anchor="middle">统一组件语义 · 保留各端最合适的呈现方式</text>

  <g transform="translate(80 138)">
    <rect width="350" height="34" rx="17" fill="#DDF6F1"/>
    <circle cx="20" cy="17" r="7" fill="#12A594"/>
    <text x="38" y="22" class="lane" fill="#087B70">GOVERNED INPUTS</text>
  </g>
  <g transform="translate(520 138)">
    <rect width="570" height="34" rx="17" fill="#DDF6F1"/>
    <circle cx="20" cy="17" r="7" fill="#12A594"/>
    <text x="38" y="22" class="lane" fill="#087B70">SHARED COMPONENT CORE</text>
  </g>
  <g transform="translate(1180 138)">
    <rect width="340" height="34" rx="17" fill="#E8E5FF"/>
    <circle cx="20" cy="17" r="7" fill="#6557E8"/>
    <text x="38" y="22" class="lane" fill="#4A3CC8">FORMAT ADAPTERS</text>
  </g>

  <!-- Core flow connectors -->
  <path d="M 400 286 C 450 286, 470 286, 520 286" fill="none" stroke="#12A594" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <path d="M 760 286 C 800 286, 810 332, 850 350" fill="none" stroke="#12A594" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <path d="M 400 500 C 590 500, 680 440, 850 410" fill="none" stroke="#12A594" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <path d="M 970 458 L 970 552" fill="none" stroke="#12A594" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-teal)"/>

  <!-- Adapter relationship arrows -->
  <path d="M 1090 365 C 1130 365, 1140 292, 1195 252" fill="none" stroke="#6557E8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-violet)"/>
  <path d="M 1090 385 C 1135 385, 1150 378, 1195 378" fill="none" stroke="#6557E8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-violet)"/>
  <path d="M 1090 405 C 1135 405, 1150 504, 1195 504" fill="none" stroke="#6557E8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-violet)"/>
  <path d="M 1090 425 C 1135 425, 1150 630, 1195 630" fill="none" stroke="#6557E8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-violet)"/>

  <!-- Layout policy arrows -->
  <path d="M 1090 597 C 1130 597, 1140 420, 1195 394" fill="none" stroke="#6557E8" stroke-width="3" stroke-dasharray="9 9" stroke-linecap="round" marker-end="url(#arrow-violet)"/>
  <path d="M 1090 610 C 1130 610, 1140 530, 1195 520" fill="none" stroke="#6557E8" stroke-width="3" stroke-dasharray="9 9" stroke-linecap="round" marker-end="url(#arrow-violet)"/>
  <path d="M 1090 623 C 1130 623, 1140 646, 1195 646" fill="none" stroke="#6557E8" stroke-width="3" stroke-dasharray="9 9" stroke-linecap="round" marker-end="url(#arrow-violet)"/>

  <!-- Input cards -->
  <g filter="url(#shadow)">
    <rect x="80" y="235" width="320" height="102" rx="16" fill="#FFFFFF" stroke="#12A594" stroke-width="2"/>
  </g>
  <circle cx="116" cy="270" r="17" fill="#DDF6F1"/>
  <path d="M 108 270 H 124 M 116 262 V 278" stroke="#087B70" stroke-width="3" stroke-linecap="round"/>
  <text x="146" y="272" class="card-title">Governed Sources</text>
  <text x="116" y="307" class="card-sub">RST · 源表 · 模板 · 术语</text>

  <g filter="url(#shadow)">
    <rect x="80" y="449" width="320" height="102" rx="16" fill="#FFFFFF" stroke="#12A594" stroke-width="2"/>
  </g>
  <circle cx="116" cy="484" r="17" fill="#DDF6F1"/>
  <path d="M 108 489 L 116 479 L 124 489" fill="none" stroke="#087B70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="146" y="486" class="card-title">Visual Manifest</text>
  <text x="116" y="521" class="card-sub">冻结复合图 · 资产身份 · 哈希</text>

  <!-- Shared core -->
  <g filter="url(#shadow)">
    <rect x="520" y="235" width="240" height="102" rx="16" fill="#12A594"/>
  </g>
  <text x="640" y="277" class="node-title" text-anchor="middle">Manual IR</text>
  <text x="640" y="307" class="node-sub" text-anchor="middle">内容与语义</text>

  <g filter="url(#shadow)">
    <rect x="850" y="326" width="240" height="132" rx="18" fill="#12A594"/>
  </g>
  <text x="970" y="366" class="node-title" text-anchor="middle">ComponentSpec</text>
  <text x="970" y="397" class="node-sub" text-anchor="middle">组件 · variant · slot</text>
  <text x="970" y="423" class="node-sub" text-anchor="middle">资产角色</text>

  <g filter="url(#shadow)">
    <rect x="850" y="552" width="240" height="102" rx="16" fill="#FFFFFF" stroke="#12A594" stroke-width="2"/>
  </g>
  <text x="970" y="590" class="card-title" text-anchor="middle">PagePlan</text>
  <text x="970" y="615" class="card-sub" text-anchor="middle">Reference Layout</text>
  <text x="970" y="636" class="card-sub" text-anchor="middle">分页 · 几何 · 版式策略</text>

  <!-- Adapter cards -->
  <g filter="url(#shadow)">
    <rect x="1195" y="207" width="325" height="90" rx="16" fill="#6557E8"/>
  </g>
  <text x="1225" y="243" class="adapter-title">Web Adapter</text>
  <text x="1225" y="270" class="adapter-sub">响应式 HTML / CSS</text>
  <rect x="1413" y="228" width="82" height="28" rx="14" fill="#EEECFF"/>
  <text x="1454" y="247" class="chip" text-anchor="middle">responsive</text>

  <g filter="url(#shadow)">
    <rect x="1195" y="333" width="325" height="90" rx="16" fill="#6557E8"/>
  </g>
  <text x="1225" y="369" class="adapter-title">LaTeX Adapter</text>
  <text x="1225" y="396" class="adapter-sub">固定页宏与印刷排版</text>
  <rect x="1415" y="354" width="80" height="28" rx="14" fill="#EEECFF"/>
  <text x="1455" y="373" class="chip" text-anchor="middle">fixed page</text>

  <g filter="url(#shadow)">
    <rect x="1195" y="459" width="325" height="90" rx="16" fill="#6557E8"/>
  </g>
  <text x="1225" y="495" class="adapter-title">IDML Adapter</text>
  <text x="1225" y="522" class="adapter-sub">可编辑对象与链接资产</text>
  <rect x="1423" y="480" width="72" height="28" rx="14" fill="#EEECFF"/>
  <text x="1459" y="499" class="chip" text-anchor="middle">editable</text>

  <g filter="url(#shadow)">
    <rect x="1195" y="585" width="325" height="90" rx="16" fill="#6557E8"/>
  </g>
  <text x="1225" y="621" class="adapter-title">Word Adapter</text>
  <text x="1225" y="648" class="adapter-sub">结构归一与编辑交换</text>
  <rect x="1410" y="606" width="85" height="28" rx="14" fill="#EEECFF"/>
  <text x="1452" y="625" class="chip" text-anchor="middle">structured</text>

  <!-- Contract callouts -->
  <g filter="url(#shadow)">
    <rect x="200" y="735" width="1200" height="105" rx="18" fill="#FFFFFF" stroke="#DAE1EA" stroke-width="2"/>
  </g>
  <circle cx="245" cy="782" r="20" fill="#DDF6F1"/>
  <path d="M 236 782 L 243 789 L 256 774" fill="none" stroke="#087B70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="280" y="777" class="callout-title">真正的“组件同源”</text>
  <text x="280" y="805" class="callout-sub">共享组件语义与资产角色；Web、LaTeX、IDML、Word 仍保留各自最合适的版式实现。</text>
  <rect x="1100" y="767" width="250" height="38" rx="19" fill="#EEECFF"/>
  <text x="1225" y="792" class="chip" text-anchor="middle">TARGET · NOT CURRENT STATE</text>
</svg>

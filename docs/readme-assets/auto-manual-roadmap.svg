<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Auto-Manual workflow roadmap</title>
  <desc id="desc">A six-stage roadmap from governed sources through frozen inputs, build, review, multi-format output, and business publishing.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17243A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#12A594"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6557E8"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 48px; font-weight: 800; fill: #18263A; letter-spacing: -0.8px; }
      .subtitle { font-size: 20px; font-weight: 500; fill: #617086; }
      .lane { font-size: 15px; font-weight: 700; letter-spacing: 1.4px; }
      .step-num { font-size: 16px; font-weight: 800; fill: #FFFFFF; }
      .step-title { font-size: 22px; font-weight: 750; fill: #FFFFFF; }
      .step-title-compact { font-size: 18px; font-weight: 750; fill: #FFFFFF; }
      .step-sub { font-size: 14px; font-weight: 500; fill: #FFFFFF; opacity: 0.88; }
      .chip { font-size: 15px; font-weight: 650; fill: #304159; }
      .chip-small { font-size: 13px; font-weight: 550; fill: #5B6B80; }
      .output { font-size: 14px; font-weight: 750; fill: #4A3CC8; }
      .gate-title { font-size: 15px; font-weight: 750; fill: #18263A; }
      .gate-sub { font-size: 13px; font-weight: 500; fill: #607086; }
      .footer { font-size: 14px; font-weight: 600; fill: #5C6A7E; }
      .dash-teal { fill: none; stroke: #12A594; stroke-width: 3; stroke-dasharray: 9 9; stroke-linecap: round; }
      .dash-violet { fill: none; stroke: #6557E8; stroke-width: 3; stroke-dasharray: 9 9; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1600" height="1040" rx="28" fill="#FAFBFD"/>
  <circle cx="1430" cy="80" r="175" fill="#E8E5FF" opacity="0.52"/>
  <circle cx="1510" cy="-5" r="108" fill="#CFF4ED" opacity="0.72"/>
  <circle cx="85" cy="940" r="205" fill="#DDF6F1" opacity="0.58"/>

  <text x="800" y="76" class="title" text-anchor="middle">Auto-Manual Workflow Roadmap</text>
  <text x="800" y="111" class="subtitle" text-anchor="middle">Governed content in · reviewable, traceable manuals out</text>

  <g transform="translate(90 142)">
    <rect width="670" height="34" rx="17" fill="#DDF6F1"/>
    <circle cx="20" cy="17" r="7" fill="#12A594"/>
    <text x="38" y="22" class="lane" fill="#087B70">ENGINEERING PLANE · auto-manual</text>
  </g>
  <g transform="translate(840 142)">
    <rect width="670" height="34" rx="17" fill="#E8E5FF"/>
    <circle cx="20" cy="17" r="7" fill="#6557E8"/>
    <text x="38" y="22" class="lane" fill="#4A3CC8">BUSINESS PLANE · Hello-Docs</text>
  </g>

  <!-- Main roadmap -->
  <path d="M 350 270 C 480 270, 500 270, 610 270" fill="none" stroke="#12A594" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <path d="M 850 270 C 970 270, 990 270, 1100 270" fill="none" stroke="#12A594" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <path d="M 1340 270 C 1470 270, 1470 480, 1340 480" fill="none" stroke="#12A594" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <path d="M 1100 480 C 980 480, 970 480, 850 480" fill="none" stroke="#12A594" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <path d="M 610 480 C 490 480, 470 480, 350 480" fill="none" stroke="#12A594" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
  <path d="M 230 525 C 230 615, 260 635, 420 635" fill="none" stroke="#6557E8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-violet)"/>

  <!-- Step 1 -->
  <g filter="url(#shadow)">
    <rect x="110" y="225" width="240" height="90" rx="16" fill="#12A594"/>
    <circle cx="142" cy="252" r="17" fill="#087B70"/>
    <text x="142" y="258" class="step-num" text-anchor="middle">1</text>
    <text x="170" y="258" class="step-title">Govern Sources</text>
    <text x="230" y="289" class="step-sub" text-anchor="middle">content · assets · terminology</text>
  </g>

  <!-- Step 2 -->
  <g filter="url(#shadow)">
    <rect x="610" y="225" width="240" height="90" rx="16" fill="#12A594"/>
    <circle cx="642" cy="252" r="17" fill="#087B70"/>
    <text x="642" y="258" class="step-num" text-anchor="middle">2</text>
    <text x="670" y="258" class="step-title">Freeze Inputs</text>
    <text x="730" y="289" class="step-sub" text-anchor="middle">snapshot · manifest · hashes</text>
  </g>

  <!-- Step 3 -->
  <g filter="url(#shadow)">
    <rect x="1100" y="225" width="240" height="90" rx="16" fill="#12A594"/>
    <circle cx="1132" cy="252" r="17" fill="#087B70"/>
    <text x="1132" y="258" class="step-num" text-anchor="middle">3</text>
    <text x="1160" y="258" class="step-title">Build &amp; Check</text>
    <text x="1220" y="289" class="step-sub" text-anchor="middle">doctor · check · review</text>
  </g>

  <!-- Step 4 -->
  <g filter="url(#shadow)">
    <rect x="1100" y="435" width="240" height="90" rx="16" fill="#12A594"/>
    <circle cx="1132" cy="462" r="17" fill="#087B70"/>
    <text x="1132" y="468" class="step-num" text-anchor="middle">4</text>
    <text x="1160" y="468" class="step-title-compact">Review &amp; Backport</text>
    <text x="1220" y="499" class="step-sub" text-anchor="middle">target edits · routed feedback</text>
  </g>

  <!-- Step 5 -->
  <g filter="url(#shadow)">
    <rect x="610" y="435" width="240" height="90" rx="16" fill="#12A594"/>
    <circle cx="642" cy="462" r="17" fill="#087B70"/>
    <text x="642" y="468" class="step-num" text-anchor="middle">5</text>
    <text x="670" y="468" class="step-title">Produce Outputs</text>
    <text x="730" y="499" class="step-sub" text-anchor="middle">one frozen bundle · many formats</text>
  </g>

  <!-- Step 6 -->
  <g filter="url(#shadow)">
    <rect x="110" y="435" width="240" height="90" rx="16" fill="#6557E8"/>
    <circle cx="142" cy="462" r="17" fill="#4A3CC8"/>
    <text x="142" y="468" class="step-num" text-anchor="middle">6</text>
    <text x="170" y="468" class="step-title">Publish &amp; Trace</text>
    <text x="230" y="499" class="step-sub" text-anchor="middle">mirror · queue · live readback</text>
  </g>

  <!-- Detail chips: sources -->
  <path d="M 150 315 L 150 347 L 96 347" class="dash-teal"/>
  <path d="M 215 315 L 215 374 L 96 374" class="dash-teal"/>
  <path d="M 280 315 L 280 347 L 364 347" class="dash-teal"/>
  <path d="M 320 315 L 320 374 L 364 374" class="dash-teal"/>
  <g>
    <rect x="34" y="330" width="130" height="34" rx="9" fill="#E4F7F3" stroke="#12A594" stroke-width="1.5"/>
    <text x="99" y="352" class="chip" text-anchor="middle">Feishu Base</text>
    <rect x="34" y="370" width="130" height="34" rx="9" fill="#E4F7F3" stroke="#12A594" stroke-width="1.5"/>
    <text x="99" y="392" class="chip" text-anchor="middle">RST templates</text>
    <rect x="350" y="330" width="144" height="34" rx="9" fill="#E4F7F3" stroke="#12A594" stroke-width="1.5"/>
    <text x="422" y="352" class="chip" text-anchor="middle">TM-B</text>
    <rect x="350" y="370" width="144" height="34" rx="9" fill="#E4F7F3" stroke="#12A594" stroke-width="1.5"/>
    <text x="422" y="392" class="chip" text-anchor="middle">Asset registry</text>
  </g>

  <!-- Detail chips: freeze/build -->
  <path d="M 730 315 L 730 344" class="dash-teal"/>
  <g>
    <rect x="566" y="344" width="328" height="56" rx="12" fill="#FFFFFF" stroke="#B9E8E1" stroke-width="2"/>
    <text x="730" y="367" class="chip" text-anchor="middle">sync-data → data/phase2</text>
    <text x="730" y="387" class="chip-small" text-anchor="middle">config + document_key select the target</text>
  </g>
  <path d="M 1220 315 L 1220 344" class="dash-teal"/>
  <g>
    <rect x="1056" y="344" width="328" height="56" rx="12" fill="#FFFFFF" stroke="#B9E8E1" stroke-width="2"/>
    <text x="1220" y="367" class="chip" text-anchor="middle">build.py is the front door</text>
    <text x="1220" y="387" class="chip-small" text-anchor="middle">deterministic fixtures keep CI reproducible</text>
  </g>

  <!-- Detail chips: review -->
  <path d="M 1340 480 L 1430 480" class="dash-teal"/>
  <g>
    <rect x="1390" y="424" width="174" height="52" rx="11" fill="#FFFFFF" stroke="#B9E8E1" stroke-width="2"/>
    <text x="1477" y="447" class="chip" text-anchor="middle">docs/_review</text>
    <text x="1477" y="466" class="chip-small" text-anchor="middle">target-owned edits</text>
    <rect x="1390" y="486" width="174" height="52" rx="11" fill="#FFFFFF" stroke="#B9E8E1" stroke-width="2"/>
    <text x="1477" y="509" class="chip" text-anchor="middle">source routing</text>
    <text x="1477" y="528" class="chip-small" text-anchor="middle">review · table · template</text>
  </g>

  <!-- Outputs -->
  <path d="M 730 525 L 730 552" class="dash-teal"/>
  <g>
    <rect x="520" y="552" width="84" height="38" rx="10" fill="#EEECFF" stroke="#7A6EEE" stroke-width="1.5"/>
    <text x="562" y="576" class="output" text-anchor="middle">PDF</text>
    <rect x="614" y="552" width="84" height="38" rx="10" fill="#EEECFF" stroke="#7A6EEE" stroke-width="1.5"/>
    <text x="656" y="576" class="output" text-anchor="middle">DOCX</text>
    <rect x="708" y="552" width="84" height="38" rx="10" fill="#EEECFF" stroke="#7A6EEE" stroke-width="1.5"/>
    <text x="750" y="576" class="output" text-anchor="middle">IDML</text>
    <rect x="802" y="552" width="84" height="38" rx="10" fill="#EEECFF" stroke="#7A6EEE" stroke-width="1.5"/>
    <text x="844" y="576" class="output" text-anchor="middle">HTML</text>
    <rect x="896" y="552" width="84" height="38" rx="10" fill="#EEECFF" stroke="#7A6EEE" stroke-width="1.5"/>
    <text x="938" y="576" class="output" text-anchor="middle">MD / ZIP</text>
  </g>

  <!-- Business publishing chain -->
  <g filter="url(#shadow)">
    <rect x="420" y="610" width="1080" height="186" rx="22" fill="#FFFFFF" stroke="#D9D5FF" stroke-width="2"/>
  </g>
  <text x="460" y="648" class="lane" fill="#4A3CC8">BUSINESS DELIVERY CHAIN</text>
  <path d="M 636 704 L 718 704" fill="none" stroke="#6557E8" stroke-width="4" marker-end="url(#arrow-violet)"/>
  <path d="M 902 704 L 1018 704" fill="none" stroke="#6557E8" stroke-width="4" marker-end="url(#arrow-violet)"/>
  <path d="M 1202 704 L 1318 704" fill="none" stroke="#6557E8" stroke-width="4" marker-end="url(#arrow-violet)"/>
  <g>
    <rect x="452" y="670" width="184" height="68" rx="13" fill="#EEECFF" stroke="#6557E8" stroke-width="2"/>
    <text x="544" y="699" class="chip" text-anchor="middle">One-way mirror</text>
    <text x="544" y="721" class="chip-small" text-anchor="middle">auto-manual → Hello-Docs</text>
    <rect x="718" y="670" width="184" height="68" rx="13" fill="#6557E8"/>
    <text x="810" y="699" class="step-title" text-anchor="middle">Publish Queue</text>
    <text x="810" y="721" class="step-sub" text-anchor="middle">frozen docs/publish PR</text>
    <rect x="1018" y="670" width="184" height="68" rx="13" fill="#EEECFF" stroke="#6557E8" stroke-width="2"/>
    <text x="1110" y="699" class="chip" text-anchor="middle">Read the Docs</text>
    <text x="1110" y="721" class="chip-small" text-anchor="middle">responsive web manual</text>
    <rect x="1318" y="670" width="150" height="68" rx="13" fill="#EEECFF" stroke="#6557E8" stroke-width="2"/>
    <text x="1393" y="699" class="chip" text-anchor="middle">Feishu writeback</text>
    <text x="1393" y="721" class="chip-small" text-anchor="middle">live URL + status</text>
  </g>
  <text x="960" y="769" class="chip-small" text-anchor="middle">Business runtime reads the new Base; RTD reads only the reviewed Git snapshot.</text>

  <!-- Quality gates -->
  <text x="800" y="848" class="lane" fill="#58677B" text-anchor="middle">QUALITY GATES AT EVERY HANDOFF</text>
  <g>
    <rect x="110" y="875" width="310" height="88" rx="15" fill="#FFFFFF" stroke="#DAE1EA" stroke-width="2"/>
    <circle cx="145" cy="908" r="15" fill="#DDF6F1"/>
    <path d="M 137 908 L 143 914 L 154 901" fill="none" stroke="#087B70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="172" y="908" class="gate-title">Scope before mutation</text>
    <text x="172" y="932" class="gate-sub">model · region · language · plane</text>

    <rect x="466" y="875" width="310" height="88" rx="15" fill="#FFFFFF" stroke="#DAE1EA" stroke-width="2"/>
    <circle cx="501" cy="908" r="15" fill="#DDF6F1"/>
    <path d="M 493 908 L 499 914 L 510 901" fill="none" stroke="#087B70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="528" y="908" class="gate-title">Hash &amp; manifest integrity</text>
    <text x="528" y="932" class="gate-sub">frozen inputs stay reproducible</text>

    <rect x="822" y="875" width="310" height="88" rx="15" fill="#FFFFFF" stroke="#DAE1EA" stroke-width="2"/>
    <circle cx="857" cy="908" r="15" fill="#DDF6F1"/>
    <path d="M 849 908 L 855 914 L 866 901" fill="none" stroke="#087B70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="884" y="908" class="gate-title">Visual &amp; content review</text>
    <text x="884" y="932" class="gate-sub">same source, format-aware QA</text>

    <rect x="1178" y="875" width="310" height="88" rx="15" fill="#FFFFFF" stroke="#DAE1EA" stroke-width="2"/>
    <circle cx="1213" cy="908" r="15" fill="#E8E5FF"/>
    <path d="M 1205 908 L 1211 914 L 1222 901" fill="none" stroke="#4A3CC8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1240" y="908" class="gate-title">Read back live state</text>
    <text x="1240" y="932" class="gate-sub">commit · artifact · URL · record</text>
  </g>

  <text x="800" y="1009" class="footer" text-anchor="middle">Start with build.py · edit sources, not generated output · keep the review trail reversible</text>
</svg>

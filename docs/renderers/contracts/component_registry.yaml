schema_version: component-registry/v1
registry_id: hb-component-registry

components:
  HB-CALLOUT-STRIP:
    style_id: HB-CALLOUT-STRIP
    source_kinds: [callout_strip, notice]
    variants: [warning, danger, caution, note, tip]
    slots:
      label:
        required: true
        content_kinds: [inline_text]
      body:
        required: true
        content_kinds: [rich_text]
      items:
        required: false
        content_kinds: [list_items]
    asset_roles: {}
    token_roles: [component.callout]
    adapters:
      web: {capability: rendered, key: manual_callout_table}
      latex: {capability: rendered, key: hb_latex_callout}
      idml: {capability: rendered, key: idml_notice}
      word: {capability: projection-only, key: word_manual_callout_table}

  HB-TABLE-SPEC:
    style_id: HB-TABLE-SPEC
    source_kinds: [table_spec, spec-table]
    variants: [vertical]
    slots:
      section_title:
        required: true
        content_kinds: [inline_text]
      rows:
        required: true
        content_kinds: [structured_rows]
    asset_roles: {}
    token_roles: [component.table.spec]
    adapters:
      web: {capability: rendered, key: hb_spec_table}
      latex: {capability: rendered, key: hb_latex_spec_table}
      idml: {capability: rendered, key: idml_spec_table}
      word: {capability: rendered, key: word_spec_table}

  HB-SPECIAL-FCC:
    style_id: HB-SPECIAL-FCC
    source_kinds: [fcc]
    variants: [two-column]
    slots:
      accessibility_label:
        required: true
        content_kinds: [inline_text]
      opening_copy:
        required: true
        content_kinds: [line_items]
      body_blocks:
        required: true
        content_kinds: [ordered_blocks]
      column_break:
        required: true
        content_kinds: [block_index]
    asset_roles:
      compliance_mark:
        required: true
        locale_policies: [shared]
    token_roles: [component.special.fcc]
    adapters:
      web: {capability: rendered, key: hb_fcc}
      latex: {capability: rendered, key: hb_latex_fcc}
      idml: {capability: rendered, key: idml_fcc}
      word: {capability: rendered, key: word_fcc}

  HB-SPECIAL-INBOX:
    style_id: HB-SPECIAL-INBOX
    source_kinds: [inbox]
    variants: [three-card-responsive]
    slots:
      accessibility_label:
        required: true
        content_kinds: [inline_text]
      cards:
        required: true
        content_kinds: [ordered_cards]
      tip_label:
        required: true
        content_kinds: [inline_text]
      tip_body:
        required: true
        content_kinds: [rich_text]
    asset_roles:
      card_1_art: {required: true, locale_policies: [shared]}
      card_2_art: {required: true, locale_policies: [shared]}
      card_3_art: {required: true, locale_policies: [shared]}
    token_roles: [component.special.inbox]
    adapters:
      web: {capability: rendered, key: hb_inbox}
      latex: {capability: rendered, key: hb_latex_inbox}
      idml: {capability: rendered, key: idml_inbox}
      word: {capability: rendered, key: word_inbox}

# JS-100F target plan on the shared Solar@INTL EU English family.
manifest_id: manual_solar_eu_en_js100f
pages:
  - type: csv_page
    slot_id: specifications_en
    source: phase2
    page: spec
    langs: [en]
    include_dir: generated/{model}

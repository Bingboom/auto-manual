# Skeleton Blueprint — BP@INTL (battery pack, international house style).
# Layer 1 of 3 (blueprint -> product manual plan -> resolved manifest).
# Owns: slot order, requirement, presentation, semantic co-page pairs.
# Carries NO languages, NO regions, NO file paths (those live in
# slot_templates.yaml and region_profiles/<region>.yaml).
schema_version: skeleton-blueprint/v1
skeleton_id: bp-intl
skeleton_family: BP
house_style: INTL

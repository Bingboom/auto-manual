# Slot -> carrier mapping for BP@INTL. Layer-1 companion of blueprint.yaml.
# Family-level knowledge only: which page type and which family-shared
# template each slot resolves to. `{lang}` / `{primary_lang}` are the only
# tokens the resolver substitutes; `{model}` passes through verbatim for the
# build-time page pipeline. Region-specific carriers (regional safety wording,
# per-line recipes, compliance fragments) live in region_profiles/<region>.yaml.
schema_version: skeleton-slot-templates/v1
skeleton_id: bp-intl
slots:
  cover:
    type: cover_pdf
    file: asset:page/cover
  preface_important:
    type: rst_include
    # BP ships a shorter three-language preface than the host manual.
    file: templates/page_bp/{primary_lang}/00_preface.rst
    lang: primary
    lang_blocks: true
  toc:
    type: rst_include
    file: templates/page_bp/{primary_lang}/00_toc.rst
    lang: primary
  safety_info:
    type: rst_include
    # No family-neutral safety template exists; the region profile MUST
    # override this slot (regional safety wording is region_profile-owned).
    file: null
  symbol_meaning:
    type: csv_page
    page: symbols
    include_dir: generated/{model}
  box_contents:
    type: rst_include
    # Battery Pack + Expansion Cable + Documents; never the host AC cable.
    file: templates/page_bp/{lang}/02_whats_in_the_box.rst
  product_overview:
    type: generated_page
    page: 03_product_overview
    engine: draft_v1
    template: templates/page_bp/{lang}/03_product_overview_placeholder.rst
    include_dir: generated/{model}/draft
    # recipe is per-line knowledge: supplied by the region profile.
  lcd_display:
    type: csv_page
    page: lcd_icons
    include_dir: generated/{model}
  operation:
    type: generated_page
    page: 05_operation_guide
    engine: draft_v1
    template: templates/page_bp/{lang}/05_operation_guide_placeholder.rst
    include_dir: generated/{model}/draft
  ups_mode:
    type: rst_include
    file: templates/page_shared/{lang}/06_ups_mode.rst
  extra_battery:
    type: rst_include
    file: templates/page_shared/{lang}/07_extra_battery.rst
  connections:
    type: rst_include
    file: templates/page_bp/{lang}/04_connections.rst
  troubleshooting:
    type: csv_page
    page: troubleshooting
    include_dir: generated/{model}
  charging:
    type: rst_include
    # BP-specific: the shared host page describes DC8020 / PV / car-charger
    # inputs the battery pack does not have. Its own charging chapter (shipped
    # printed 06) routes both AC and solar THROUGH the HomePower 2000 Plus.
    file: templates/page_bp/{lang}/08_charging_methods.rst
  storage:
    type: rst_include
    # Consumes the shared long-storage advisory through a {{snippet:...}} token
    # instead of carrying a tenth hand copy of it (skeleton slice S3).
    file: templates/page_bp/{lang}/09_storage.rst
  specifications:
    type: csv_page
    page: spec
    include_dir: generated/{model}
  warranty:
    type: rst_include
    # Preserve the shipped BP warranty copy without host-only section carriers.
    file: templates/page_bp/{lang}/11_warranty.rst
  regulatory_compliance:
    type: rst_include
    # The legal carrier is region-owned and must be supplied by the selecting
    # region profile. Keeping the family mapping path-free prevents one
    # market's declaration from becoming the global BP fallback.
    file: null
  back_cover:
    type: rst_include
    file: templates/page_bp/{primary_lang}/99_back_cover.rst
    lang: primary

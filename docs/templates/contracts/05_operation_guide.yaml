# Tiered on the same axis as 03_product_overview (skeleton slices S2/S4).
# The standby duration is shared: the shipped HTP017 US book states the battery
# pack shuts down after 2 hours without charge or load, which is the same fact
# the host prints as DEFAULT_STANDBY_DURATION. The three energy-saving values
# describe a feature the battery pack does not have, so they move to
# category:MAIN. Targets that declare no build.skeleton_family resolve as MAIN
# and therefore still select all four, unchanged.
required_placeholders:
  default:
    - DEFAULT_STANDBY_DURATION
  category:MAIN:
    - ENERGY_SAVING_AUTO_OFF_DURATION
    - ENERGY_SAVING_AC_THRESHOLD
    - ENERGY_SAVING_DC_THRESHOLD
  category:BP: []

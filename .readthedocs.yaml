version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - pandoc
  jobs:
    install:
      - python -m pip install --upgrade pip
      - python -m pip install -r requirements.lock
    build:
      html:
        # Hello-Docs/main carries reviewed, frozen Web source merged from the
        # publish candidate branch under docs/publish/web. RTD renders only the
        # main snapshot and never reads live Feishu data. Keep the review-bundle
        # path as a bootstrap fallback until the first publish snapshot exists.
        - |
          if [ -f docs/publish/web/conf.py ]; then
            python -m sphinx -b html docs/publish/web "$READTHEDOCS_OUTPUT/html"
          else
            AUTO_MANUAL_PRESENTATION_PROFILE=web python build.py md --config configs/config.us.yaml --model JE-1000F --region US --source review-asis --data-root tests/fixtures/phase2 --no-clean --skip-root-index
            python tools/readthedocs_source.py --build-root docs/_build --output-dir docs/_build/rtd --title "Auto Manual Library"
            python -m sphinx -b html docs/_build/rtd "$READTHEDOCS_OUTPUT/html"
          fi
